<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stoïkos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f6f5ff;color:#243047}header{padding:18px;background:white;border-bottom:1px solid #ddd;font-weight:900}main{max-width:940px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:18px;margin:14px 0;box-shadow:0 8px 25px #0000000a}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #ddd;padding:12px;border-radius:12px;margin:8px 0}.score{font-size:38px;font-weight:900;color:#7c3aed}button,select,input{padding:9px;border-radius:9px;border:1px solid #ddd}button{background:#7c3aed;color:white;font-weight:bold;cursor:pointer}.red{background:#dc2626}.green{background:#059669}.orange{background:#d97706}.meta{color:#697386;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}@media(max-width:650px){.row{align-items:flex-start;flex-direction:column}.row div,.row select,.row input{max-width:100%}}</style></head><body><header>🌈 Stoïkos</header><main id="app">Chargement…</main><script>const db=supabase.createClient('https://vxippwxflbmiximzlvmo.supabase.co','sb_publishable_IwJG0MgCbUgjxh5w4EH6aQ_OGmhkuza'),q=new URLSearchParams(location.search),ct=q.get('token'),pt=q.get('parent');async function rpc(n,a){let{data,error}=await db.rpc(n,a);if(error)throw error;return data}const tm=x=>new Date(x).toLocaleTimeString('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit'});async function child(){let d=await rpc('stoikos_enfant',{p_token:ct});app.innerHTML=`<div class="grid"><div class="card"><h1>Bonjour ${d.enfant}</h1><div class="score">${d.score} pt</div><p>Obligation faite : 0. Oubli : −1. Bonus validé : +1.</p></div><div class="card"><h2>Temps d’écran</h2><div class="score">${d.minutes} min</div></div></div><div class="card"><h2>À faire aujourd’hui</h2>${d.taches.map(t=>`<div class="row"><div><b>${t.faite?'✅':'○'} ${t.label}</b><div class="meta">À faire avant ${tm(t.heure_action)} · déclaration jusqu’à ${tm(t.echeance_declaration)}</div></div><button ${!t.faite&&new Date(t.echeance_declaration)<=new Date()?'disabled':''} onclick="tick('${t.cle}')">${t.faite?'Annuler':'J’ai fait'}</button></div>`).join('')}</div><div class="card"><h2>Corvée optionnelle</h2><select id="b"><option value="lave">Vider le lave-vaisselle</option><option value="repas">Préparer à manger</option><option value="table">Débarrasser toute la table</option><option value="aspi">Passer l’aspirateur cuisine + salle à manger</option></select> <button onclick="bonus()">Déclarer</button>${d.bonus.map(b=>`<div class="row"><div>${b.label}<div class="meta">${b.statut}</div></div>${b.statut==='en_attente'?`<button class="red" onclick="delb('${b.id}')">Supprimer</button>`:''}</div>`).join('')}</div><div class="card"><h2>Pénalités</h2>${d.penalites.map(p=>`<div class="row"><span>${p.label}</span><b>−1</b></div>`).join('')||'Aucune'}</div>`}async function tick(c){try{await rpc('stoikos_cocher',{p_token:ct,p_cle:c});await child()}catch(e){alert(e.message)}}async function bonus(){try{await rpc('stoikos_bonus',{p_token:ct,p_code:b.value});await child()}catch(e){alert(e.message)}}async function delb(i){try{await rpc('stoikos_suppr_bonus',{p_token:ct,p_id:i});await child()}catch(e){alert(e.message)}}async function parent(){let d=await rpc('stoikos_parent',{p_token:pt}),cs=d.enfants;app.innerHTML=`<div class="card"><h1>Espace parent</h1><div class="grid">${cs.map(c=>`<div><h3>${c.prenom}</h3><div class="score">${c.score}</div><div>Bonus +${c.bonus} · Malus ${c.malus} · ${c.temps} min</div></div>`).join('')}</div></div><div class="card"><h2>Minutes par point</h2><input id="mins" type="number" value="${d.minutes}"> <button onclick="minutes()">Modifier</button></div><div class="card"><h2>➕ Ajouter un bonus</h2><select id="bc">${cs.map(c=>`<option value="${c.id}">${c.prenom}</option>`).join('')}</select> <input id="bl" placeholder="Motif du bonus"> <button class="green" onclick="pab()">Ajouter +1</button></div><div class="card"><h2>✅ Bonus validés cette semaine</h2>${d.bonus.filter(b=>b.statut==='validee').map(b=>`<div class="row"><div><b>${b.enfant}</b> · ${b.label}<div class="meta">${b.date} · +1</div></div><div><button onclick="pb('${b.id}','en_attente')">Annuler validation</button> <button class="red" onclick="pbd('${b.id}')">Supprimer</button></div></div>`).join('')||'Aucun bonus validé.'}</div><div class="card"><h2>🟠 Bonus à traiter</h2>${d.bonus.filter(b=>b.statut!=='validee').map(b=>`<div class="row"><div><b>${b.enfant}</b> · ${b.label}<div class="meta">${b.statut}</div></div><div><button class="green" onclick="pb('${b.id}','validee')">Valider +1</button> <button class="red" onclick="pb('${b.id}','refusee')">Refuser</button></div></div>`).join('')||'Aucun.'}</div><div class="card"><h2>❌ Obligations non réalisées</h2>${d.penalites.map(p=>`<div class="row"><div><b>${p.enfant}</b> · ${p.label}<div class="meta">${p.date} · −1</div></div><button class="green" onclick="pdp('${p.id}')">Annuler le malus</button></div>`).join('')||'Aucun malus.'}<hr><select id="pc">${cs.map(c=>`<option value="${c.id}">${c.prenom}</option>`).join('')}</select> <input id="pl" placeholder="Motif du malus"> <button class="red" onclick="pap()">Ajouter −1</button></div><div class="card"><h2>Couvert · 7 jours</h2>${d.repas.map(r=>`<div class="row"><span>${r.date} · ${r.repas}</span><select onchange="meal('${r.date}','${r.repas}',this.value)">${cs.map(c=>`<option value="${c.id}" ${c.id===r.enfant_id?'selected':''}>${c.prenom}</option>`).join('')}</select></div>`).join('')}</div>`}async function pb(i,s){try{await rpc('stoikos_parent_bonus',{p_token:pt,p_id:i,p_statut:s});await parent()}catch(e){alert(e.message)}}async function pbd(i){try{await rpc('stoikos_parent_suppr_bonus',{p_token:pt,p_id:i});await parent()}catch(e){alert(e.message)}}async function pdp(i){try{await rpc('stoikos_parent_suppr_penalite',{p_token:pt,p_id:i});await parent()}catch(e){alert('Impossible d’annuler le malus : '+e.message)}}async function pap(){try{await rpc('stoikos_parent_penalite',{p_token:pt,p_enfant:pc.value,p_label:pl.value||'Pénalité parent'});await parent()}catch(e){alert(e.message)}}async function pab(){try{await rpc('stoikos_parent_ajouter_bonus',{p_token:pt,p_enfant:bc.value,p_label:bl.value||'Bonus parent'});await parent()}catch(e){alert(e.message)}}async function minutes(){try{await rpc('stoikos_parent_minutes',{p_token:pt,p_minutes:+mins.value});await parent()}catch(e){alert(e.message)}}async function meal(d,r,e){try{await rpc('stoikos_parent_repas',{p_token:pt,p_date:d,p_repas:r,p_enfant:e});await parent()}catch(x){alert(x.message)}}(async()=>{try{pt?await parent():ct?await child():app.innerHTML='<div class="card">Utilise un lien enfant ou parent généré par Supabase.</div>'}catch(e){app.innerHTML='<div class="card"><h2>Erreur</h2><pre>'+e.message+'</pre></div>'}})();</script></body></html>
