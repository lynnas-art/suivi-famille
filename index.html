<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stoïkos · Suivi famille</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#25304a;--muted:#697386;--violet:#7c3aed;--green:#059669;--orange:#d97706;--red:#dc2626;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff1f7,#f2f5ff 55%,#effff7);min-height:100vh}header{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;background:#ffffffdf;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.brand{font-size:1.35rem;font-weight:900}.pill{padding:8px 12px;border-radius:999px;background:#ede9fe;color:#5b21b6;font-weight:800}main{max-width:940px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 30px #4c1d950d;margin-bottom:16px}h1,h2,h3{margin:0 0 10px}p{color:var(--muted)}.score{font-size:3rem;font-weight:950;color:var(--violet)}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:15px;padding:13px}.row.done{background:#ecfdf5;border-color:#a7f3d0}.row.pending{background:#fff7ed;border-color:#fed7aa}.row.refused{background:#fef2f2;border-color:#fecaca}.label{font-weight:850}.meta{font-size:.85rem;color:var(--muted);margin-top:3px}button,select,input{font:inherit}button{border:0;border-radius:11px;padding:9px 12px;font-weight:850;cursor:pointer;background:var(--violet);color:#fff}button.red{background:#fee2e2;color:#991b1b}button.green{background:var(--green)}button.orange{background:var(--orange)}button:disabled{opacity:.45;cursor:not-allowed}select,input{padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff}.form{display:grid;grid-template-columns:1fr auto;gap:9px}.actions{display:flex;gap:7px;flex-wrap:wrap}.notice{padding:12px;border-radius:12px;background:#fff7ed;color:#9a3412}.error{background:#fef2f2;color:#991b1b}.childcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.childcard{border:1px solid var(--line);border-radius:15px;padding:14px}.small{font-size:.84rem}.empty{color:var(--muted);font-style:italic}@media(max-width:680px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.score{font-size:2.5rem}.row{align-items:flex-start;flex-direction:column}.row>.actions,.row>select{width:100%}.row select{width:100%}}
</style>
</head>
<body>
<header><div class="brand">🌈 Stoïkos</div><div class="pill" id="profile">Chargement…</div></header>
<main id="app"><div class="card">Connexion à Supabase…</div></main>
<script>
const SUPABASE_URL='https://vxippwxflbmiximzlvmo.supabase.co';
const SUPABASE_KEY='sb_publishable_IwJG0MgCbUgjxh5w4EH6aQ_OGmhkuza';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const qs=new URLSearchParams(location.search), childToken=qs.get('token'), parentToken=qs.get('parent');
const bonusOptions=[['lave_vaisselle','Vider le lave-vaisselle'],['preparer_manger','Préparer à manger'],['debarrasser_table','Débarrasser toute la table'],['aspirateur','Passer l’aspirateur dans la cuisine et la salle à manger']];
const frDate=x=>new Date(x).toLocaleDateString('fr-FR',{timeZone:'Europe/Paris',weekday:'long',day:'numeric',month:'long'});
const frTime=x=>new Date(x).toLocaleTimeString('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit'});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function rpc(name,args){const {data,error}=await db.rpc(name,args);if(error)throw error;return data}
async function loadChild(){const d=await rpc('stoikos_dashboard_enfant',{p_token:childToken});document.querySelector('#profile').textContent=d.enfant.prenom;renderChild(d)}
function renderChild(d){document.querySelector('#app').innerHTML=`
<section class="grid"><div class="card"><h1>Bonjour ${esc(d.enfant.prenom)} 👋</h1><p>Les obligations faites évitent une pénalité. Seuls les bonus validés par un parent rapportent +1.</p><div class="score">${d.score} point${Math.abs(d.score)>1?'s':''}</div></div><div class="card"><h2>Temps d’écran</h2><div class="score">${d.minutes_ecran} min</div><p class="small">Le temps ne peut jamais être négatif. Clôture vendredi à 19 h.</p></div></section>
<div class="card"><h2>Obligations d’aujourd’hui</h2><div class="list">${d.taches.length?d.taches.map(t=>{const late=new Date(t.echeance)<=new Date();return `<div class="row ${t.faite?'done':''}"><div><div class="label">${t.faite?'✅':'○'} ${esc(t.label)}</div><div class="meta">Échéance ${frTime(t.echeance)} · 0 point si faite, −1 si oubliée</div></div><button ${late&&!t.faite?'disabled':''} onclick="toggleTask('${esc(t.cle)}')">${t.faite?'Annuler':'J’ai fait'}</button></div>`}).join(''):'<div class="empty">Aucune obligation aujourd’hui.</div>'}</div></div>
<div class="card"><h2>Déclarer une corvée optionnelle</h2><p>Le bonus restera en attente jusqu’à la validation d’un parent.</p><div class="form"><select id="bonus"><option value="">Choisir une corvée…</option>${bonusOptions.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><button onclick="addBonus()">Déclarer</button></div></div>
<div class="card"><h2>Mes bonus cette semaine</h2><div class="list">${d.bonus.length?d.bonus.map(b=>`<div class="row ${b.statut==='en_attente'?'pending':b.statut==='refusee'?'refused':'done'}"><div><div class="label">${esc(b.label)}</div><div class="meta">${b.statut==='en_attente'?'🟠 En attente de validation':b.statut==='validee'?'🟢 Validée +1':'🔴 Refusée'}</div></div>${b.statut==='en_attente'?`<button class="red" onclick="deleteBonus('${b.id}')">Supprimer</button>`:''}</div>`).join(''):'<div class="empty">Aucune corvée optionnelle déclarée.</div>'}</div></div>
<div class="card"><h2>Pénalités de la semaine</h2><div class="list">${d.penalites.length?d.penalites.map(p=>`<div class="row refused"><div><div class="label">${esc(p.label)}</div><div class="meta">${esc(p.date)} · obligation non réalisée</div></div><strong>−1</strong></div>`).join(''):'<div class="empty">Aucune pénalité.</div>'}</div></div>`}
async function toggleTask(cle){try{await rpc('stoikos_toggle_obligation',{p_token:childToken,p_cle:cle});await loadChild()}catch(e){alert(e.message)}}
async function addBonus(){const code=document.querySelector('#bonus').value;if(!code)return;try{await rpc('stoikos_declarer_bonus',{p_token:childToken,p_code:code});await loadChild()}catch(e){alert(e.message)}}
async function deleteBonus(id){try{await rpc('stoikos_supprimer_bonus',{p_token:childToken,p_id:id});await loadChild()}catch(e){alert(e.message)}}
async function loadParent(){const d=await rpc('stoikos_dashboard_parent',{p_token:parentToken});document.querySelector('#profile').textContent='Espace parent';renderParent(d)}
function renderParent(d){const children=d.enfants||[];document.querySelector('#app').innerHTML=`
<div class="card"><h1>👨‍👩‍👧 Espace parent</h1><p>Validation des bonus, attribution du couvert et suivi des résultats.</p><div class="childcards">${children.map(c=>`<div class="childcard"><h3>${esc(c.prenom)}</h3><div class="score">${c.score}</div><div>${c.minutes_ecran} minutes d’écran</div></div>`).join('')}</div></div>
<div class="card"><h2>Réglage du temps d’écran</h2><div class="form"><input id="minutes" type="number" min="0" max="120" value="${d.minutes_par_point}"><button onclick="saveMinutes()">Enregistrer</button></div></div>
<div class="card"><h2>Bonus à valider</h2><div class="list">${d.bonus_en_attente.length?d.bonus_en_attente.map(b=>`<div class="row pending"><div><div class="label">${esc(b.label)}</div><div class="meta">Déclarée par ${esc(b.enfant)}</div></div><div class="actions"><button class="green" onclick="validateBonus('${b.id}',true)">Valider +1</button><button class="red" onclick="validateBonus('${b.id}',false)">Refuser</button></div></div>`).join(''):'<div class="empty">Aucun bonus en attente.</div>'}</div></div>
<div class="card"><h2>Couvert · 7 prochains jours</h2><p>Un seul enfant est responsable par repas. L’alternance est automatique et chaque liste permet une exception.</p><div class="list">${d.repas.map(r=>`<div class="row"><div><div class="label">🍽️ ${frDate(r.date+'T12:00:00')} · ${r.repas}</div></div><select onchange="setMeal('${r.date}','${r.repas}',this.value)">${children.map(c=>`<option value="${c.id}" ${c.id===r.enfant_id?'selected':''}>${esc(c.prenom)}</option>`).join('')}</select></div>`).join('')}</div></div>
<div class="card"><h2>Historique des semaines clôturées</h2><div class="list">${d.historique.length?d.historique.map(h=>`<div class="row"><div><div class="label">${esc(h.enfant)} · semaine du ${frDate(h.cycle_debut)}</div><div class="meta">Résultat figé vendredi à 19 h</div></div><strong>${h.points} pt · ${h.minutes_ecran} min</strong></div>`).join(''):'<div class="empty">Aucune semaine clôturée pour le moment.</div>'}</div></div>`}
async function validateBonus(id,ok){try{await rpc('stoikos_valider_bonus',{p_token:parentToken,p_id:id,p_accepter:ok});await loadParent()}catch(e){alert(e.message)}}
async function saveMinutes(){try{await rpc('stoikos_regler_minutes',{p_token:parentToken,p_minutes:Number(document.querySelector('#minutes').value)});await loadParent()}catch(e){alert(e.message)}}
async function setMeal(date,repas,enfant){try{await rpc('stoikos_attribuer_repas',{p_token:parentToken,p_date:date,p_repas:repas,p_enfant:enfant});await loadParent()}catch(e){alert(e.message)}}
(async()=>{try{if(parentToken)await loadParent();else if(childToken)await loadChild();else throw new Error('Utilisez le lien personnel enfant ou le lien parent fourni par Supabase.')}catch(e){document.querySelector('#profile').textContent='Erreur';document.querySelector('#app').innerHTML=`<div class="card error"><h2>Impossible d’ouvrir Stoïkos</h2><p>${esc(e.message)}</p><p>Exécutez le fichier SQL complet dans Supabase, puis utilisez l’un des nouveaux liens affichés.</p></div>`}})();
</script>
</body></html>
