<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stoïkos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f6f5ff;color:#243047}header{padding:18px;background:white;border-bottom:1px solid #ddd;font-weight:900}main{max-width:900px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:18px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #ddd;padding:12px;border-radius:12px;margin:8px 0}.score{font-size:42px;font-weight:900;color:#7c3aed}button,select,input{padding:9px;border-radius:9px;border:1px solid #ddd}button{background:#7c3aed;color:white;font-weight:bold}.red{background:#dc2626}.green{background:#059669}.meta{color:#697386;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}</style></head><body><header>🌈 Stoïkos</header><main id="app">Chargement…</main><script>const db=supabase.createClient('https://vxippwxflbmiximzlvmo.supabase.co','sb_publishable_IwJG0MgCbUgjxh5w4EH6aQ_OGmhkuza'),q=new URLSearchParams(location.search),ct=q.get('token'),pt=q.get('parent');async function rpc(n,a){let{data,error}=await db.rpc(n,a);if(error)throw error;return data}const tm=x=>new Date(x).toLocaleTimeString('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit'});async function child(){let d=await rpc('stoikos_enfant',{p_token:ct});app.innerHTML=`<div class="grid"><div class="card"><h1>Bonjour ${d.enfant}</h1><div class="score">${d.score} pt</div><p>Obligation faite : 0. Oubli : −1. Bonus validé : +1.</p></div><div class="card"><h2>Temps d’écran</h2><div class="score">${d.minutes} min</div></div></div><div class="card"><h2>À faire aujourd’hui</h2>${d.taches.map(t=>`<div class="row"><div><b>${t.faite?'✅':'○'} ${t.label}</b><div class="meta">À faire avant ${tm(t.heure_action)} · déclaration jusqu’à ${tm(t.echeance_declaration)}</div></div><button ${!t.faite&&new Date(t.echeance_declaration)<=new Date()?'disabled':''} onclick="tick('${t.cle}')">${t.faite?'Annuler':'J’ai fait'}</button></div>`).join('')}</div><div class="card"><h2>Corvée optionnelle</h2><select id="b"><option value="lave">Vider le lave-vaisselle</option><option value="repas">Préparer à manger</option><option value="table">Débarrasser toute la table</option><option value="aspi">Passer l’aspirateur cuisine + salle à manger</option></select> <button onclick="bonus()">Déclarer</button>${d.bonus.map(b=>`<div class="row"><div>${b.label}<div class="meta">${b.statut}</div></div>${b.statut==='en_attente'?`<button class="red" onclick="delb('${b.id}')">Supprimer</button>`:''}</div>`).join('')}</div><div class="card"><h2>Pénalités</h2>${d.penalites.map(p=>`<div class="row"><span>${p.label}</span><b>−1</b></div>`).join('')||'Aucune'}</div>`}async function tick(c){await rpc('stoikos_cocher',{p_token:ct,p_cle:c});child()}async function bonus(){await rpc('stoikos_bonus',{p_token:ct,p_code:b.value});child()}async function delb(i){await rpc('stoikos_suppr_bonus',{p_token:ct,p_id:i});child()}async function parent(){let d=await rpc('stoikos_parent',{p_token:pt}),cs=d.enfants;app.innerHTML=`<div class="card"><h1>Espace parent</h1><div class="grid">${cs.map(c=>`<div><h3>${c.prenom}</h3><div class="score">${c.score}</div>${c.temps} min</div>`).join('')}</div></div><div class="card"><h2>Minutes par point</h2><input id="mins" type="number" value="${d.minutes}"> <button onclick="minutes()">Modifier</button></div><div class="card"><h2>Tous les bonus</h2>${d.bonus.map(b=>`<div class="row"><div><b>${b.enfant}</b> · ${b.label}<div class="meta">${b.statut}</div></div><div><button class="green" onclick="pb('${b.id}','validee')">+1</button> <button onclick="pb('${b.id}','en_attente')">Attente</button> <button class="red" onclick="pb('${b.id}','refusee')">Refuser</button> <button class="red" onclick="pbd('${b.id}')">Suppr.</button></div></div>`).join('')||'Aucun'}</div><div class="card"><h2>Pénalités</h2>${d.penalites.map(p=>`<div class="row"><span><b>${p.enfant}</b> · ${p.label}</span><button class="red" onclick="pdp('${p.id}')">Supprimer</button></div>`).join('')}<select id="pc">${cs.map(c=>`<option value="${c.id}">${c.prenom}</option>`).join('')}</select> <input id="pl" placeholder="Motif"> <button onclick="pap()">Ajouter −1</button></div><div class="card"><h2>Couvert · 7 jours</h2>${d.repas.map(r=>`<div class="row"><span>${r.date} · ${r.repas}</span><select onchange="meal('${r.date}','${r.repas}',this.value)">${cs.map(c=>`<option value="${c.id}" ${c.id===r.enfant_id?'selected':''}>${c.prenom}</option>`).join('')}</select></div>`).join('')}</div>`}async function pb(i,s){await rpc('stoikos_parent_bonus',{p_token:pt,p_id:i,p_statut:s});parent()}async function pbd(i){await rpc('stoikos_parent_suppr_bonus',{p_token:pt,p_id:i});parent()}async function pdp(i){await rpc('stoikos_parent_suppr_penalite',{p_token:pt,p_id:i});parent()}async function pap(){await rpc('stoikos_parent_penalite',{p_token:pt,p_enfant:pc.value,p_label:pl.value||'Pénalité parent'});parent()}async function minutes(){await rpc('stoikos_parent_minutes',{p_token:pt,p_minutes:+mins.value});parent()}async function meal(d,r,e){await rpc('stoikos_parent_repas',{p_token:pt,p_date:d,p_repas:r,p_enfant:e});parent()}(async()=>{try{pt?await parent():ct?await child():app.innerHTML='<div class="card">Utilise un lien enfant ou parent généré par Supabase.</div>'}catch(e){app.innerHTML='<div class="card"><h2>Erreur</h2><pre>'+e.message+'</pre></div>'}})();</script></body></html>
