<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stoïkos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f6f5ff;color:#243047}header{padding:18px;background:white;font-weight:900}main{max-width:940px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:18px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #ddd;padding:12px;border-radius:12px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.score{font-size:38px;font-weight:900;color:#7c3aed}.programme{margin-top:12px}.programme .ligne{padding:7px 0;border-top:1px solid #eee;font-size:14px}button,select,input{padding:9px;border-radius:9px;border:1px solid #ddd}button{background:#7c3aed;color:white;font-weight:bold}.green{background:#059669}.red{background:#dc2626}.meta{color:#697386;font-size:13px}@media(max-width:650px){.row{flex-direction:column;align-items:flex-start}}</style></head><body><header>🌈 Stoïkos</header><main id="app">Chargement…</main><script>
const db=supabase.createClient('https://vxippwxflbmiximzlvmo.supabase.co','sb_publishable_IwJG0MgCbUgjxh5w4EH6aQ_OGmhkuza'),q=new URLSearchParams(location.search),ct=q.get('token'),pt=q.get('parent');
async function rpc(n,a){let{data,error}=await db.rpc(n,a);if(error)throw error;return data}
const tm=x=>new Date(x).toLocaleTimeString('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit'});
const jour=x=>new Date(x+'T12:00:00').toLocaleDateString('fr-FR',{timeZone:'Europe/Paris',weekday:'long',day:'numeric',month:'short'});
const etat=s=>s==='fait'?'✅ Fait':s==='non_fait'?'❌ Non réalisé':s==='malus_annule'?'↩️ Non réalisé, malus annulé':'⏳ À faire';
const etatBonus=s=>s==='validee'?'Validé':s==='refusee'?'Refusé':'En attente';
async function child(){let d=await rpc('stoikos_enfant',{p_token:ct});app.innerHTML=`<div class="grid"><div class="card"><h1>Bonjour ${d.enfant}</h1><div class="score">${d.score} pt</div></div><div class="card"><h2>Temps d’écran</h2><div class="score">${d.minutes} min</div></div></div><div class="card"><h2>Obligations</h2>${d.taches.map(t=>`<div class="row"><div><b>${t.faite?'✅':'○'} ${t.label}</b><div class="meta">À faire avant ${tm(t.heure_action)} · déclarable jusqu’à ${tm(t.echeance_declaration)}</div></div><button onclick="tick('${t.cle}')">${t.faite?'Annuler':'J’ai fait'}</button></div>`).join('')}</div><div class="card"><h2>Bonus</h2><select id="b"><option value="lave">Vider le lave-vaisselle</option><option value="repas">Préparer à manger</option><option value="table">Débarrasser la table</option><option value="aspi">Passer l’aspirateur</option></select><button onclick="bonus()">Déclarer</button>${d.bonus.map(x=>`<div class="row"><span>${x.label} · ${etatBonus(x.statut)}</span>${x.statut==='en_attente'?`<button class="red" onclick="delb('${x.id}')">Supprimer</button>`:''}</div>`).join('')}</div>`}
async function tick(c){await rpc('stoikos_cocher',{p_token:ct,p_cle:c});child()}async function bonus(){await rpc('stoikos_bonus',{p_token:ct,p_code:b.value});child()}async function delb(i){await rpc('stoikos_suppr_bonus',{p_token:ct,p_id:i});child()}
async function parent(){let d=await rpc('stoikos_parent',{p_token:pt}),cs=d.enfants;app.innerHTML=`<div class="card"><h1>Espace parent</h1><div class="grid">${cs.map(c=>`<div><h2>${c.prenom}</h2><div class="score">${c.score}</div><div>${c.temps} min d’écran</div><div class="programme"><b>Programme obligatoire aujourd’hui</b>${d.obligations.filter(o=>o.enfant_id===c.id).map(o=>`<div class="ligne"><b>${etat(o.statut)}</b> · ${o.label}${o.penalite_id?` <button class="green" onclick="pdp('${o.penalite_id}')">Annuler le malus</button>`:''}</div>`).join('')||'<div class="ligne">Aucune obligation aujourd’hui</div>'}</div></div>`).join('')}</div></div><div class="card"><h2>➕ Ajouter un bonus</h2><select id="bc">${cs.map(c=>`<option value="${c.id}">${c.prenom}</option>`).join('')}</select><input id="bl" placeholder="Motif"><button class="green" onclick="pab()">Ajouter +1</button></div><div class="card"><h2>Bonus à valider</h2>${d.bonus.map(x=>`<div class="row"><span><b>${x.enfant}</b> · ${x.label} · ${etatBonus(x.statut)}</span><button class="green" onclick="pb('${x.id}','validee')">Valider</button></div>`).join('')}</div><div class="card"><h2>Malus</h2>${d.penalites.map(x=>`<div class="row"><span><b>${x.enfant}</b> · ${x.label}</span><button class="green" onclick="pdp('${x.id}')">Annuler le malus</button></div>`).join('')||'Aucun'}</div><div class="card"><h2>Couvert · 7 prochains jours</h2>${d.repas.map(r=>`<div class="row"><span><b>${jour(r.date)}</b> · ${r.repas}</span><select onchange="meal('${r.date}','${r.repas}',this.value)">${cs.map(c=>`<option value="${c.id}" ${c.id===r.enfant_id?'selected':''}>${c.prenom}</option>`).join('')}</select></div>`).join('')}</div>`}
async function pdp(i){try{await rpc('stoikos_parent_suppr_penalite',{p_token:pt,p_id:i});parent()}catch(e){alert(e.message)}}async function pb(i,s){await rpc('stoikos_parent_bonus',{p_token:pt,p_id:i,p_statut:s});parent()}async function pab(){await rpc('stoikos_parent_ajouter_bonus',{p_token:pt,p_enfant:bc.value,p_label:bl.value||'Bonus parent'});parent()}async function meal(d,r,e){await rpc('stoikos_parent_repas',{p_token:pt,p_date:d,p_repas:r,p_enfant:e});parent()}(async()=>{try{pt?await parent():ct?await child():app.innerHTML='Lien requis'}catch(e){app.innerHTML='<div class="card">Erreur : '+e.message+'</div>'}})();
</script></body></html>
