<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌈 Suivi Famille</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --pink: #ec4899; --pink-light: #fce7f3; --pink-mid: #f9a8d4;
    --green: #34d399; --green-light: #d1fae5;
    --yellow: #fbbf24; --yellow-light: #fef3c7;
    --red: #f87171; --red-light: #fee2e2;
    --blue: #60a5fa; --blue-light: #dbeafe;
    --bg: linear-gradient(135deg, #fff0f6 0%, #f0f4ff 50%, #f0fff4 100%);
    --card: rgba(255,255,255,0.92);
    --text: #2d2d2d; --muted: #9ca3af;
    --radius: 20px; --shadow: 0 4px 24px rgba(236,72,153,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); }

  /* BLOBS */
  .blob1 { position: fixed; top:-80px; right:-80px; width:300px; height:300px; background: radial-gradient(circle, #fbcfe8 0%, transparent 70%); border-radius:50%; pointer-events:none; z-index:0; }
  .blob2 { position: fixed; bottom:-100px; left:-60px; width:350px; height:350px; background: radial-gradient(circle, #bfdbfe 0%, transparent 70%); border-radius:50%; pointer-events:none; z-index:0; }

  /* HEADER */
  header { position:relative; z-index:10; background:rgba(255,255,255,0.88); backdrop-filter:blur(10px); border-bottom:2px solid var(--pink-light); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .logo { font-family:'Fredoka One',cursive; font-size:22px; color:var(--pink); }
  .week-pill { background:var(--pink-light); color:#be185d; padding:4px 14px; border-radius:20px; font-size:13px; font-weight:700; }

  /* NAV */
  nav { position:relative; z-index:10; background:rgba(255,255,255,0.75); backdrop-filter:blur(6px); border-bottom:1px solid var(--pink-mid); display:flex; overflow-x:auto; padding:0 8px; gap:2px; }
  nav button { background:none; border:none; padding:11px 15px; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:700; font-size:13px; color:var(--muted); border-bottom:3px solid transparent; white-space:nowrap; transition:all .2s; }
  nav button.active { color:var(--pink); border-bottom-color:var(--pink); }

  /* CONTENT */
  main { position:relative; z-index:1; max-width:860px; margin:0 auto; padding:20px 14px 60px; }

  /* CARD */
  .card { background:var(--card); border-radius:var(--radius); padding:22px; border:2px solid var(--pink-light); box-shadow:var(--shadow); margin-bottom:16px; }

  /* CHILD TABS */
  .child-tabs { display:flex; gap:10px; margin-bottom:16px; }
  .child-tab { background:#f9fafb; border:2px solid #e5e7eb; border-radius:14px; padding:8px 20px; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:800; font-size:15px; color:#6b7280; transition:all .2s; }
  .child-tab.active { background:var(--pink-light); border-color:var(--pink-mid); color:var(--pink); }

  /* SECTION TITLE */
  .section-title { font-family:'Fredoka One',cursive; font-size:19px; color:var(--pink); margin-bottom:14px; }

  /* SCORE CARDS */
  .two-col { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; }
  .child-card { background:var(--card); border-radius:var(--radius); padding:22px; border:2px solid var(--pink-light); box-shadow:var(--shadow); }
  .card-head { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
  .big-emoji { font-size:40px; }
  .child-name { font-family:'Fredoka One',cursive; font-size:22px; color:var(--pink); }
  .screen-badge { display:inline-block; border-radius:20px; padding:3px 12px; font-size:12px; font-weight:800; margin-top:4px; }
  .pts-row { display:flex; align-items:baseline; gap:4px; margin-bottom:8px; }
  .pts-num { font-size:54px; font-weight:900; line-height:1; }
  .pts-den { font-size:20px; color:#cbd5e1; }
  .bar-bg { height:12px; background:#f1f5f9; border-radius:99px; overflow:hidden; margin-bottom:14px; }
  .bar-fill { height:100%; border-radius:99px; transition:width .5s ease; }
  .btn-row { display:flex; gap:10px; margin-bottom:14px; }
  .btn-minus { flex:2; background:linear-gradient(135deg,#fda4af,#fb7185); color:#fff; border:none; border-radius:12px; padding:10px 8px; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:800; font-size:13px; }
  .btn-plus { flex:1; background:linear-gradient(135deg,#6ee7b7,#34d399); color:#fff; border:none; border-radius:12px; padding:10px 8px; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:800; font-size:13px; }
  .events-box { border-top:1px dashed var(--pink-light); padding-top:10px; }
  .evt-row { display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding:5px 0; border-bottom:1px dashed #f9a8d4; }
  .evt-label { flex:1; font-size:13px; color:#4b5563; min-width:120px; }
  .evt-pts { font-weight:800; font-size:14px; min-width:36px; text-align:right; }
  .evt-date { color:var(--muted); font-size:11px; width:100%; }

  /* DEDUCT GRID */
  .deduct-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .deduct-btn { background:#fff8f8; border:2px solid #fecdd3; border-radius:14px; padding:12px 10px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:4px; transition:transform .1s; }
  .deduct-btn:hover { transform:scale(1.03); }
  .deduct-emoji { font-size:20px; }
  .deduct-label { font-size:12px; color:#374151; font-weight:700; line-height:1.3; }
  .deduct-pts { font-size:14px; color:#f43f5e; font-weight:900; }

  /* CHORES */
  .chore-section { background:rgba(255,255,255,0.9); border-radius:18px; padding:18px; margin-bottom:14px; border:2px solid var(--pink-light); }
  .chore-section-title { font-family:'Fredoka One',cursive; font-size:17px; color:var(--pink); margin-bottom:6px; }
  .chore-subtitle { font-size:12px; color:var(--muted); margin-bottom:10px; }
  .chore-row { display:flex; align-items:center; gap:12px; padding:7px 0; border-bottom:1px dashed var(--pink-light); }
  .chore-row:last-child { border-bottom:none; }
  .chore-row.disabled { opacity:0.35; }
  .checkbox { width:28px; height:28px; border-radius:8px; border:2px solid var(--pink-mid); background:#fff; cursor:pointer; font-weight:900; font-size:16px; color:var(--pink); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; }
  .checkbox.done { background:var(--pink-light); border-color:var(--pink); }
  .chore-label { flex:1; font-size:14px; color:#374151; font-weight:600; }
  .chore-owner { font-size:11px; color:var(--muted); background:#f3f4f6; border-radius:10px; padding:2px 8px; }
  .today-badge { background:var(--pink); color:#fff; font-size:10px; font-weight:800; padding:2px 8px; border-radius:10px; }

  /* RULES */
  .rule-row { display:flex; align-items:flex-start; gap:14px; padding:10px 0; border-bottom:1px dashed var(--pink-light); }
  .rule-row:last-child { border-bottom:none; }
  .rule-emoji { font-size:22px; flex-shrink:0; }
  .rule-num { background:var(--pink-light); color:var(--pink); width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:50%; font-weight:900; font-size:13px; flex-shrink:0; }
  .rule-text { font-size:14px; color:#374151; font-weight:600; line-height:1.5; }
  .screen-row { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-radius:12px; margin-bottom:6px; }
  .screen-range { font-weight:700; font-size:14px; color:#374151; }
  .screen-time { font-weight:900; font-size:14px; color:var(--pink); }

  /* ARCHIVE */
  .archive-controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  select { background:#fff; border:2px solid var(--pink-mid); border-radius:10px; padding:8px 12px; font-size:14px; font-family:'Nunito',sans-serif; color:#374151; font-weight:700; }
  .archive-summary { display:flex; align-items:center; flex-wrap:wrap; gap:12px; padding:12px 0 16px; border-bottom:2px dashed var(--pink-light); margin-bottom:12px; }
  .archive-name { font-size:18px; font-family:'Fredoka One',cursive; color:var(--pink); }
  .archive-pts { font-size:18px; font-weight:900; }
  .archive-screen { font-size:13px; color:#6b7280; font-weight:700; }

  /* MODAL */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px; }
  .modal { background:#fff; border-radius:24px; padding:28px; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; border:2px solid var(--pink-light); box-shadow:0 20px 60px rgba(236,72,153,0.15); }
  .modal-title { font-family:'Fredoka One',cursive; font-size:20px; color:var(--pink); margin-bottom:18px; }
  input[type=text], input[type=number] { width:100%; background:#fff8f8; border:2px solid #fecdd3; border-radius:10px; padding:10px 14px; font-size:14px; font-family:'Nunito',sans-serif; color:#374151; margin-bottom:10px; }
  .btn-confirm { width:100%; background:linear-gradient(135deg,#f9a8d4,#ec4899); color:#fff; border:none; border-radius:12px; padding:12px; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:900; font-size:15px; margin-bottom:8px; }
  .btn-cancel { width:100%; background:#f9fafb; color:var(--muted); border:2px solid #e5e7eb; border-radius:12px; padding:12px; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:700; font-size:14px; }
  .empty { color:var(--muted); text-align:center; padding:20px 0; font-style:italic; }
  .loading { color:var(--muted); text-align:center; padding:30px; font-size:16px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1f2937; color:#fff; padding:10px 24px; border-radius:20px; font-weight:700; font-size:14px; z-index:300; animation:fadeup .3s ease; }
  @keyframes fadeup { from { opacity:0; transform:translateX(-50%) translateY(10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
  .input-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .input-row label { font-weight:700; color:#6b7280; white-space:nowrap; }
  .input-row input { margin-bottom:0; }
</style>
</head>
<body>
<div class="blob1"></div>
<div class="blob2"></div>

<header>
  <div class="logo">🌈 Suivi Famille</div>
  <div class="week-pill" id="week-pill">Chargement...</div>
</header>

<nav>
  <button class="active" onclick="showTab('accueil')">🏠 Accueil</button>
  <button onclick="showTab('comportement')">⭐ Comportement</button>
  <button onclick="showTab('corvees')">✅ Corvées</button>
  <button onclick="showTab('regles')">📋 Règles</button>
  <button onclick="showTab('archive')">📦 Archive</button>
</nav>

<main id="main">
  <div class="loading">⏳ Connexion à la base de données...</div>
</main>

<!-- MODAL -->
<div class="overlay" id="modal" style="display:none" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-title">Retirer des points</div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ── CONFIG SUPABASE ───────────────────────────────────────────────
const SUPABASE_URL = 'https://vxippwxflbmiximzlvmo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_IwJG0MgCbUgjxh5w4EH6aQ_OGmhkuza';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ── CONSTANTS ─────────────────────────────────────────────────────
const CHILDREN = ['Adèle', 'Noah'];
const INIT_PTS = 20;

const DEDUCTIONS = [
  { label:'Insolence / mauvaise réponse', pts:2, emoji:'😤' },
  { label:'Mauvaise tenue à table', pts:1, emoji:'🍽️' },
  { label:'Assiette non débarrassée', pts:1, emoji:'🥣' },
  { label:'Coucher non respecté (20h30)', pts:2, emoji:'🌙' },
  { label:'Dispute / bagarre', pts:3, emoji:'👊' },
  { label:'Mensonge', pts:3, emoji:'🤥' },
  { label:'Devoirs non faits', pts:2, emoji:'📚' },
  { label:'Douche non prise', pts:2, emoji:'🚿' },
  { label:'Corvée non réalisée', pts:2, emoji:'🧹' },
  { label:'Autre', pts:1, emoji:'⚡' },
];

// Couvert alternance : index pair = Adèle, impair = Noah
const COUVERT = [
  { key:'couvert_0', label:'Lundi soir',    dayOffset:2, slot:'soir' },
  { key:'couvert_1', label:'Mardi soir',    dayOffset:3, slot:'soir' },
  { key:'couvert_2', label:'Mercredi midi', dayOffset:4, slot:'midi' },
  { key:'couvert_3', label:'Mercredi soir', dayOffset:4, slot:'soir' },
  { key:'couvert_4', label:'Jeudi soir',    dayOffset:5, slot:'soir' },
  { key:'couvert_5', label:'Vendredi soir', dayOffset:6, slot:'soir' },
  { key:'couvert_6', label:'Samedi midi',   dayOffset:0, slot:'midi' },
  { key:'couvert_7', label:'Samedi soir',   dayOffset:0, slot:'soir' },
  { key:'couvert_8', label:'Dimanche midi', dayOffset:1, slot:'midi' },
  { key:'couvert_9', label:'Dimanche soir', dayOffset:1, slot:'soir' },
];

// Adèle douche : lun(2),mer(4),ven(6) sans cheveux; dim(1) avec
const ADELE_DOUCHE = [
  { key:'douche_0', label:'Lundi — sans cheveux', dayOffset:2 },
  { key:'douche_1', label:'Mercredi — sans cheveux', dayOffset:4 },
  { key:'douche_2', label:'Vendredi — sans cheveux', dayOffset:6 },
  { key:'douche_3', label:'Dimanche — avec les cheveux', dayOffset:1 },
];
// Noah douche tous les jours
const NOAH_DOUCHE = [
  { key:'douche_sat', label:'Samedi', dayOffset:0 },
  { key:'douche_sun', label:'Dimanche', dayOffset:1 },
  { key:'douche_mon', label:'Lundi', dayOffset:2 },
  { key:'douche_tue', label:'Mardi', dayOffset:3 },
  { key:'douche_wed', label:'Mercredi', dayOffset:4 },
  { key:'douche_thu', label:'Jeudi', dayOffset:5 },
  { key:'douche_fri', label:'Vendredi', dayOffset:6 },
];
const DEVOIRS = [
  { key:'devoirs_0', label:'Lundi', dayOffset:2 },
  { key:'devoirs_1', label:'Mardi', dayOffset:3 },
  { key:'devoirs_2', label:'Mercredi', dayOffset:4 },
  { key:'devoirs_3', label:'Jeudi', dayOffset:5 },
  { key:'devoirs_4', label:'Vendredi', dayOffset:6 },
];
const RANGEMENT = [{ key:'rangement_lundi', label:'Ranger ses affaires — lundi soir', dayOffset:2 }];

function screenTime(pts) {
  if (pts >= 17) return '2h30 d\'écran 🎮';
  if (pts >= 13) return '2h d\'écran 🎮';
  if (pts >= 9)  return '1h30 d\'écran 🎮';
  if (pts >= 5)  return '1h d\'écran 🎮';
  if (pts >= 1)  return '30min d\'écran 🎮';
  return 'Pas d\'écran cette semaine 😢';
}

// ── WEEK UTILS ────────────────────────────────────────────────────
function getMostRecentSaturday(d = new Date()) {
  const day = d.getDay(); // 0=Sun,6=Sat
  const diff = day === 6 ? 0 : (day + 1);
  const sat = new Date(d);
  sat.setDate(d.getDate() - diff);
  sat.setHours(0,0,0,0);
  return sat.toISOString().slice(0,10);
}
function weekLabel(wk) {
  const d = new Date(wk + 'T12:00:00');
  const e = new Date(d); e.setDate(d.getDate()+6);
  return `${d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} → ${e.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}`;
}
function todayOffset(weekKey) {
  const sat = new Date(weekKey + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.round((now - sat) / 86400000);
  return Math.max(0, Math.min(6, diff));
}

// ── STATE ─────────────────────────────────────────────────────────
let state = {
  tab: 'accueil',
  weekKey: getMostRecentSaturday(),
  activeChild: 'Adèle',
  choreChild: 'Adèle',
  archiveChild: 'Adèle',
  archiveWeek: getMostRecentSaturday(),
  scores: {}, // { 'Adèle': 20, 'Noah': 20 }
  events: {}, // { 'Adèle': [...], 'Noah': [...] }
  chores: {}, // { 'Adèle': { key: true/false }, 'Noah': ... }
  allWeeks: [],
};

// ── DB FUNCTIONS ──────────────────────────────────────────────────
async function loadWeek(weekKey) {
  // Load or create semaine rows
  for (const enfant of CHILDREN) {
    const { data, error } = await db.from('semaines')
      .select('*').eq('enfant', enfant).eq('semaine_debut', weekKey).maybeSingle();
    if (!data) {
      await db.from('semaines').insert({ enfant, semaine_debut: weekKey, points: INIT_PTS });
      state.scores[enfant] = INIT_PTS;
    } else {
      state.scores[enfant] = data.points;
    }
  }
  // Load events
  const { data: evts } = await db.from('evenements')
    .select('*').eq('semaine_debut', weekKey).order('created_at', { ascending: false });
  state.events = { 'Adèle': [], 'Noah': [] };
  (evts || []).forEach(e => state.events[e.enfant].push(e));

  // Load chores
  const { data: chrs } = await db.from('corvees')
    .select('*').eq('semaine_debut', weekKey);
  state.chores = { 'Adèle': {}, 'Noah': {} };
  (chrs || []).forEach(c => { state.chores[c.enfant][c.cle] = c.fait; });
}

async function loadAllWeeks() {
  const { data } = await db.from('semaines').select('semaine_debut').order('semaine_debut', { ascending: false });
  const weeks = [...new Set((data||[]).map(r => r.semaine_debut))];
  if (!weeks.includes(state.weekKey)) weeks.unshift(state.weekKey);
  state.allWeeks = weeks;
}

async function applyDeduction(enfant, label, pts) {
  const newPts = Math.max(0, state.scores[enfant] - pts);
  await db.from('semaines').update({ points: newPts }).eq('enfant', enfant).eq('semaine_debut', state.weekKey);
  await db.from('evenements').insert({ enfant, semaine_debut: state.weekKey, label, points: pts });
  state.scores[enfant] = newPts;
  state.events[enfant].unshift({ enfant, label, points: pts, created_at: new Date().toISOString() });
  render();
  showToast(`−${pts} pt${pts>1?'s':''} pour ${enfant}`);
}

async function restorePoint(enfant) {
  const newPts = Math.min(INIT_PTS, state.scores[enfant] + 1);
  await db.from('semaines').update({ points: newPts }).eq('enfant', enfant).eq('semaine_debut', state.weekKey);
  await db.from('evenements').insert({ enfant, semaine_debut: state.weekKey, label: '✨ Point rendu', points: -1 });
  state.scores[enfant] = newPts;
  state.events[enfant].unshift({ enfant, label: '✨ Point rendu', points: -1, created_at: new Date().toISOString() });
  render();
  showToast(`+1 pt pour ${enfant} 🎁`);
}

async function toggleChore(enfant, cle, currentVal) {
  const newVal = !currentVal;
  state.chores[enfant][cle] = newVal;
  await db.from('corvees').upsert({ enfant, semaine_debut: state.weekKey, cle, fait: newVal }, { onConflict: 'enfant,semaine_debut,cle' });
  render();
}

// ── RENDER ────────────────────────────────────────────────────────
function showTab(tab) {
  state.tab = tab;
  document.querySelectorAll('nav button').forEach((b,i) => {
    b.classList.toggle('active', ['accueil','comportement','corvees','regles','archive'][i] === tab);
  });
  render();
}

function render() {
  document.getElementById('week-pill').textContent = `Sem. du ${weekLabel(state.weekKey)}`;
  const main = document.getElementById('main');
  switch(state.tab) {
    case 'accueil':      main.innerHTML = renderAccueil(); break;
    case 'comportement': main.innerHTML = renderComportement(); break;
    case 'corvees':      main.innerHTML = renderCorvees(); break;
    case 'regles':       main.innerHTML = renderRegles(); break;
    case 'archive':      main.innerHTML = renderArchive(); break;
  }
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
}

function scoreColor(pts) {
  const pct = pts / INIT_PTS * 100;
  return pct===100 ? '#34d399' : pct>=60 ? '#fbbf24' : '#f87171';
}
function scoreBg(pts) {
  const pct = pts / INIT_PTS * 100;
  return pct===100 ? '#d1fae5' : pct>=60 ? '#fef3c7' : '#fee2e2';
}
function scoreTxt(pts) {
  const pct = pts / INIT_PTS * 100;
  return pct===100 ? '#065f46' : pct>=60 ? '#78350f' : '#7f1d1d';
}

// ACCUEIL
function renderAccueil() {
  return `<div class="two-col">${CHILDREN.map(c => renderChildCard(c)).join('')}</div>`;
}
function renderChildCard(name) {
  const pts = state.scores[name] ?? INIT_PTS;
  const pct = pts / INIT_PTS * 100;
  const color = scoreColor(pts);
  const emoji = name==='Adèle'?'🌸':'🌟';
  const evts = (state.events[name]||[]).slice(0,4);
  return `
  <div class="child-card">
    <div class="card-head">
      <span class="big-emoji">${emoji}</span>
      <div>
        <div class="child-name">${name}</div>
        <span class="screen-badge" style="background:${scoreBg(pts)};color:${scoreTxt(pts)}">${screenTime(pts)}</span>
      </div>
    </div>
    <div class="pts-row">
      <span class="pts-num" style="color:${color}">${pts}</span>
      <span class="pts-den">/ ${INIT_PTS}</span>
    </div>
    <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
    <div class="btn-row">
      <button class="btn-minus" onclick="openModal('${name}')">− Retirer des points</button>
      <button class="btn-plus" onclick="restorePoint('${name}')">+1 pt 🎁</button>
    </div>
    ${evts.length ? `<div class="events-box">${evts.map(e=>`
      <div class="evt-row">
        <span class="evt-label">${e.label}</span>
        <span class="evt-pts" style="color:${e.points>0?'#f87171':'#34d399'}">${e.points>0?'−'+e.points:'+'+Math.abs(e.points)}</span>
        <span class="evt-date">${fmtDate(e.created_at)}</span>
      </div>`).join('')}</div>` : ''}
  </div>`;
}

// COMPORTEMENT
function renderComportement() {
  const c = state.activeChild;
  const evts = state.events[c]||[];
  return `
  <div class="child-tabs">${CHILDREN.map(ch=>`<button class="child-tab${ch===c?' active':''}" onclick="setActiveChild('${ch}')">${ch==='Adèle'?'🌸':'🌟'} ${ch}</button>`).join('')}</div>
  <div class="card">
    <div class="section-title">Retirer des points à ${c}</div>
    <div class="deduct-grid">${DEDUCTIONS.map(d=>`
      <button class="deduct-btn" onclick="handleDeduct('${c}','${d.label}',${d.pts})">
        <span class="deduct-emoji">${d.emoji}</span>
        <span class="deduct-label">${d.label}</span>
        <span class="deduct-pts">−${d.pts} pt${d.pts>1?'s':''}</span>
      </button>`).join('')}</div>
  </div>
  <div class="card">
    <div class="section-title">Historique — ${c}</div>
    ${evts.length===0?'<p class="empty">Aucun événement cette semaine 🎉</p>':evts.map(e=>`
    <div class="evt-row">
      <span class="evt-label">${e.label}</span>
      <span class="evt-pts" style="color:${e.points>0?'#f87171':'#34d399'}">${e.points>0?'−'+e.points:'+'+Math.abs(e.points)}</span>
      <span class="evt-date">${fmtDate(e.created_at)}</span>
    </div>`).join('')}
  </div>`;
}

// CORVÉES — seulement les corvées du jour
function renderCorvees() {
  const c = state.choreChild;
  const offset = todayOffset(state.weekKey);
  const chores = state.chores[c]||{};

  // Filter couvert for today + who owns it
  const todayCouvert = COUVERT.filter(cv => cv.dayOffset === offset);
  // Check if it's morning or evening to show midi/soir (show both for now)
  const couvertItems = todayCouvert.map((cv, i) => {
    const globalIdx = COUVERT.indexOf(cv);
    const owner = globalIdx%2===0?'Adèle':'Noah';
    const isMe = owner===c;
    return { ...cv, owner, isMe, globalIdx };
  });

  // Filter douche for today
  const douche = c==='Adèle' ? ADELE_DOUCHE : NOAH_DOUCHE;
  const todayDouche = douche.filter(d => d.dayOffset===offset);

  // Filter devoirs for today
  const todayDevoirs = DEVOIRS.filter(d => d.dayOffset===offset);

  // Rangement only Monday (offset 2)
  const todayRangement = RANGEMENT.filter(r => r.dayOffset===offset);

  const dayNames = ['Samedi','Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi'];
  const todayName = dayNames[offset];

  const noChores = couvertItems.length===0 && todayDouche.length===0 && todayDevoirs.length===0 && todayRangement.length===0;

  return `
  <div class="child-tabs">${CHILDREN.map(ch=>`<button class="child-tab${ch===c?' active':''}" onclick="setChoreChild('${ch}')">${ch==='Adèle'?'🌸':'🌟'} ${ch}</button>`).join('')}</div>
  <div style="background:var(--pink-light);border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;">
    <span style="font-size:22px">📅</span>
    <div>
      <div style="font-family:'Fredoka One',cursive;font-size:17px;color:var(--pink)">Corvées du jour — ${todayName}</div>
      <div style="font-size:12px;color:#be185d">Seules les corvées d'aujourd'hui sont affichées</div>
    </div>
  </div>

  ${noChores ? `<div class="card"><p class="empty">🎉 Pas de corvées aujourd'hui pour ${c} !</p></div>` : ''}

  ${couvertItems.length>0 ? `
  <div class="chore-section">
    <div class="chore-section-title">🍽️ Mettre le couvert</div>
    ${couvertItems.map(cv=>`
    <div class="chore-row${!cv.isMe?' disabled':''}">
      <button class="checkbox${chores[cv.key]?' done':''}" onclick="${cv.isMe?`toggleChore('${c}','${cv.key}',${!!chores[cv.key]})`:'void(0)'}">${chores[cv.key]?'✓':''}</button>
      <span class="chore-label">${cv.slot==='midi'?'🌞 Midi':'🌙 Soir'}</span>
      ${!cv.isMe?`<span class="chore-owner">→ ${cv.owner}</span>`:''}
    </div>`).join('')}
  </div>` : ''}

  ${todayDouche.length>0 ? `
  <div class="chore-section">
    <div class="chore-section-title">🚿 Douche avant le dîner</div>
    ${todayDouche.map(d=>`
    <div class="chore-row">
      <button class="checkbox${chores[d.key]?' done':''}" onclick="toggleChore('${c}','${d.key}',${!!chores[d.key]})">${chores[d.key]?'✓':''}</button>
      <span class="chore-label">${d.label}</span>
    </div>`).join('')}
  </div>` : ''}

  ${todayDevoirs.length>0 ? `
  <div class="chore-section">
    <div class="chore-section-title">📚 Devoirs avant le dîner</div>
    ${todayDevoirs.map(d=>`
    <div class="chore-row">
      <button class="checkbox${chores[d.key]?' done':''}" onclick="toggleChore('${c}','${d.key}',${!!chores[d.key]})">${chores[d.key]?'✓':''}</button>
      <span class="chore-label">Faire ses devoirs</span>
    </div>`).join('')}
  </div>` : ''}

  ${todayRangement.length>0 ? `
  <div class="chore-section">
    <div class="chore-section-title">📦 Rangement</div>
    ${todayRangement.map(r=>`
    <div class="chore-row">
      <button class="checkbox${chores[r.key]?' done':''}" onclick="toggleChore('${c}','${r.key}',${!!chores[r.key]})">${chores[r.key]?'✓':''}</button>
      <span class="chore-label">${r.label}</span>
    </div>`).join('')}
  </div>` : ''}`;
}

// RÈGLES
function renderRegles() {
  const rules = [
    {emoji:'🙏',text:'Respecter les adultes et ne pas répondre'},
    {emoji:'🍽️',text:'Bien se tenir à table : manger proprement et respectueusement'},
    {emoji:'🥣',text:'Débarrasser son assiette en sortant de table (vider les restes + lave-vaisselle)'},
    {emoji:'🌙',text:'Coucher : monter à 20h30, se laver les dents, pyjama, au lit. Lecture possible jusqu\'à 21h'},
  ];
  const couvertRules = ['Table nettoyée à l\'éponge','Assiettes et couverts','Serviette + verre d\'eau','Bouteille d\'eau remplie','Dessous de plat','Sel, poivre, vinaigrette'];
  const screenRows = [
    {range:'20 – 17 pts', time:'2h30 d\'écran', bg:'#d1fae5'},
    {range:'16 – 13 pts', time:'2h d\'écran', bg:'#fef3c7'},
    {range:'12 – 9 pts',  time:'1h30 d\'écran', bg:'#ffedd5'},
    {range:'8 – 5 pts',   time:'1h d\'écran', bg:'#fee2e2'},
    {range:'4 – 1 pts',   time:'30 min d\'écran', bg:'#fce7f3'},
    {range:'0 pt',        time:'Pas d\'écran', bg:'#f1f5f9'},
  ];
  return `
  <div class="card">
    <div class="section-title">📋 Règles de comportement</div>
    ${rules.map(r=>`<div class="rule-row"><span class="rule-emoji">${r.emoji}</span><span class="rule-text">${r.text}</span></div>`).join('')}
  </div>
  <div class="card">
    <div class="section-title">🍽️ Règles du couvert</div>
    ${couvertRules.map((r,i)=>`<div class="rule-row"><span class="rule-num">${i+1}</span><span class="rule-text">${r}</span></div>`).join('')}
  </div>
  <div class="card">
    <div class="section-title">🎮 Temps d'écran selon les points</div>
    ${screenRows.map(r=>`<div class="screen-row" style="background:${r.bg}"><span class="screen-range">${r.range}</span><span class="screen-time">${r.time}</span></div>`).join('')}
  </div>`;
}

// ARCHIVE
function renderArchive() {
  const weeks = state.allWeeks.length ? state.allWeeks : [state.weekKey];
  return `
  <div class="card">
    <div class="section-title">📦 Archive des semaines</div>
    <div class="archive-controls">
      <select onchange="setArchiveWeek(this.value)">
        ${weeks.map(w=>`<option value="${w}"${w===state.archiveWeek?' selected':''}>${weekLabel(w)}${w===state.weekKey?' ← en cours':''}</option>`).join('')}
      </select>
      <select onchange="setArchiveChild(this.value)">
        ${CHILDREN.map(c=>`<option${c===state.archiveChild?' selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <div id="archive-content"><div class="loading">⏳ Chargement...</div></div>
  </div>`;
}

async function loadArchiveContent() {
  const enfant = state.archiveChild;
  const wk = state.archiveWeek;
  const { data: sem } = await db.from('semaines').select('points').eq('enfant',enfant).eq('semaine_debut',wk).maybeSingle();
  const pts = sem ? sem.points : INIT_PTS;
  const { data: evts } = await db.from('evenements').select('*').eq('enfant',enfant).eq('semaine_debut',wk).order('created_at',{ascending:false});
  const el = document.getElementById('archive-content');
  if (!el) return;
  el.innerHTML = `
    <div class="archive-summary">
      <span class="archive-name">${enfant}</span>
      <span class="archive-pts" style="color:${scoreColor(pts)}">${pts}/${INIT_PTS} pts</span>
      <span class="archive-screen">${screenTime(pts)}</span>
    </div>
    ${!evts||evts.length===0?'<p class="empty">Aucun événement enregistré.</p>':evts.map(e=>`
    <div class="evt-row">
      <span class="evt-label">${e.label}</span>
      <span class="evt-pts" style="color:${e.points>0?'#f87171':'#34d399'}">${e.points>0?'−'+e.points:'+'+Math.abs(e.points)}</span>
      <span class="evt-date">${fmtDate(e.created_at)}</span>
    </div>`).join('')}`;
}

// ── MODAL ─────────────────────────────────────────────────────────
function openModal(child) {
  document.getElementById('modal-title').textContent = `Retirer des points — ${child}`;
  document.getElementById('modal-body').innerHTML = `
    <div class="deduct-grid">${DEDUCTIONS.map(d=>`
      <button class="deduct-btn" onclick="handleDeductModal('${child}','${d.label}',${d.pts})">
        <span class="deduct-emoji">${d.emoji}</span>
        <span class="deduct-label">${d.label}</span>
        <span class="deduct-pts">−${d.pts} pt${d.pts>1?'s':''}</span>
      </button>`).join('')}</div>
    <button class="btn-cancel" style="margin-top:12px" onclick="closeModal()">Annuler</button>`;
  document.getElementById('modal').style.display='flex';
}
function closeModal() { document.getElementById('modal').style.display='none'; }

function handleDeductModal(child, label, pts) {
  if (label==='Autre') {
    document.getElementById('modal-body').innerHTML = `
      <input type="text" id="custom-label" placeholder="Description de l'incident…" />
      <div class="input-row"><label>Points à retirer :</label><input type="number" id="custom-pts" value="1" min="1" max="20" style="width:70px"/></div>
      <button class="btn-confirm" onclick="confirmCustom('${child}')">Confirmer</button>
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>`;
  } else {
    closeModal();
    applyDeduction(child, `${DEDUCTIONS.find(d=>d.label===label)?.emoji||''} ${label}`, pts);
  }
}
function confirmCustom(child) {
  const label = document.getElementById('custom-label').value.trim();
  const pts = parseInt(document.getElementById('custom-pts').value)||1;
  if (label) { closeModal(); applyDeduction(child, `⚡ ${label}`, pts); }
}

function handleDeduct(child, label, pts) {
  if (label==='Autre') {
    openModal(child);
    setTimeout(()=>handleDeductModal(child,label,pts),50);
  } else {
    applyDeduction(child, `${DEDUCTIONS.find(d=>d.label===label)?.emoji||''} ${label}`, pts);
  }
}

// ── ACTIONS (global) ──────────────────────────────────────────────
window.openModal = openModal;
window.closeModal = closeModal;
window.handleDeduct = handleDeduct;
window.handleDeductModal = handleDeductModal;
window.confirmCustom = confirmCustom;
window.restorePoint = restorePoint;
window.toggleChore = toggleChore;
window.showTab = showTab;
window.setActiveChild = (c) => { state.activeChild=c; render(); };
window.setChoreChild = (c) => { state.choreChild=c; render(); };
window.setArchiveWeek = async (w) => { state.archiveWeek=w; render(); await loadArchiveContent(); };
window.setArchiveChild = async (c) => { state.archiveChild=c; render(); await loadArchiveContent(); };

// ── TOAST ─────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

// ── INIT ──────────────────────────────────────────────────────────
async function init() {
  try {
    await loadWeek(state.weekKey);
    await loadAllWeeks();
    render();
    // After archive tab renders, load archive content
    if (state.tab==='archive') await loadArchiveContent();
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="card"><p style="color:#f87171;font-weight:700">❌ Erreur de connexion à Supabase.<br><small>${e.message}</small></p></div>`;
  }
}

// Re-load archive content after render when on archive tab
const origShowTab = window.showTab;
window.showTab = async (tab) => {
  origShowTab(tab);
  if (tab==='archive') await loadArchiveContent();
};

init();
</script>
</body>
