<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stoïkos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f6f5ff;color:#243047}header{padding:18px;background:white;font-weight:900}main{max-width:1050px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:18px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #ddd;padding:12px;border-radius:12px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.score{font-size:38px;font-weight:900;color:#7c3aed}button,select,input{padding:9px;border-radius:9px;border:1px solid #ddd}button{background:#7c3aed;color:white;font-weight:bold;cursor:pointer}.green{background:#059669}.red{background:#dc2626}.orange{background:#d97706}.meta{color:#697386;font-size:13px}.jour{margin-top:16px;border-top:2px solid #ede9fe;padding-top:10px}.programme{margin-top:12px}.ligne{padding:7px 0;border-top:1px solid #eee;font-size:14px}.alerte{background:#fff7ed;color:#9a3412;padding:14px;border-radius:12px;margin-bottom:12px}@media(max-width:650px){.row{flex-direction:column;align-items:flex-start}.row>div,.row>select{width:100%}}</style></head><body><header>🌈 Stoïkos</header><main id="app">Chargement…</main><script>
const db=supabase.createClient('https://vxippwxflbmiximzlvmo.supabase.co','sb_publishable_IwJG0MgCbUgjxh5w4EH6aQ_OGmhkuza'),q=new URLSearchParams(location.search),ct=q.get('token'),pt=q.get('parent');
async function rpc(n,a){const{data,error}=await db.rpc(n,a);if(error)throw error;return data}
const heure=x=>new Date(x).toLocaleTimeString('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit'});
const dateLongue=x=>new Date(x+'T12:00:00').toLocaleDateString('fr-FR',{timeZone:'Europe/Paris',weekday:'long',day:'numeric',month:'long'});
const etat=s=>s==='fait'?'✅ Fait':s==='non_fait'?'❌ Non réalisé':s==='malus_annule'?'↩️ Non réalisé, malus annulé':'⏳ À faire';
const etatBonus=s=>s==='validee'?'Validé':s==='refusee'?'Refusé':'En attente';
async function enfant(){const d=await rpc('stoikos_enfant',{p_token:ct});app.innerHTML=`${d.attente_validation?'<div class="alerte">La semaine est terminée. Le nouveau programme apparaîtra après validation finale des parents.</div>':''}<div class="grid"><div class="card"><h1>Bonjour ${d.enfant}</h1><div class="score">Tu as ${d.score} pt${Math.abs(d.score)>1?'s':''} bonus</div><p>Base du week-end : 2 h. Chaque point ajoute ou retire 15 minutes.</p></div><div class="card"><h2>Temps d’écran du WE</h2><div class="score">${d.minutes} min</div><p>Minimum 0 min · maximum 4 h</p></div></div><div class="card"><h2>À faire aujourd’hui</h2>${d.taches.length?d.taches.map(t=>`<div class="row"><div><b>${t.faite?'✅':'○'} ${t.label}</b><div class="meta">À faire avant ${heure(t.heure_action)} · déclarable jusqu’à ${heure(t.echeance_declaration)}</div></div><button onclick="cocher('${t.cle}')">${t.faite?'Annuler':'J’ai fait'}</button></div>`).join(''):'Aucune obligation disponible.'}</div><div class="card"><h2>Bonus de la semaine en cours</h2><select id="bonusChoisi"><option value="lave">Vider le lave-vaisselle</option><option value="repas">Préparer à manger</option><option value="table">Débarrasser la table</option><option value="aspi">Passer l’aspirateur</option></select> <button onclick="ajouterBonus()">Déclarer</button>${d.bonus.length?d.bonus.map(x=>`<div class="row"><div><b>${x.label}</b><div class="meta">${dateLongue(x.date)} · ${etatBonus(x.statut)}</div></div>${x.statut==='en_attente'?`<button class="red" onclick="supprimerBonus('${x.id}')">Supprimer</button>`:''}</div>`).join(''):'<p>Aucun bonus déclaré cette semaine.</p>'}</div>`}
async function cocher(c){try{await rpc('stoikos_cocher',{p_token:ct,p_cle:c});enfant()}catch(e){alert(e.message)}}async function ajouterBonus(){try{await rpc('stoikos_bonus',{p_token:ct,p_code:bonusChoisi.value});enfant()}catch(e){alert(e.message)}}async function supprimerBonus(i){try{await rpc('stoikos_suppr_bonus',{p_token:ct,p_id:i});enfant()}catch(e){alert(e.message)}}
function programmeEnfant(d,c){const lignes=d.obligations.filter(o=>o.enfant_id===c.id);const groupes={};lignes.forEach(o=>(groupes[o.date]??=[]).push(o));return Object.keys(groupes).sort().reverse().map(date=>`<div class="jour"><b>${dateLongue(date)}</b>${groupes[date].map(o=>`<div class="row"><div><b>${etat(o.statut)}</b> · ${o.label}<div class="meta">Déclaration prévue jusqu’à ${heure(o.echeance)}</div></div><div>${o.statut!=='fait'?`<button class="green" onclick='statutObligation(${JSON.stringify(o)},true)'>Marquer fait</button>`:`<button class="orange" onclick='statutObligation(${JSON.stringify(o)},false)'>Marquer non fait</button>`}${o.penalite_id?` <button class="green" onclick="annulerMalus('${o.penalite_id}')">Annuler le malus</button>`:''}</div></div>`).join('')}</div>`).join('')}
async function parent(){const d=await rpc('stoikos_parent',{p_token:pt}),cs=d.enfants;app.innerHTML=`${d.validation_requise?'<div class="alerte"><b>Validation finale requise.</b> Vérifie les obligations, bonus et malus, puis valide les temps d’écran pour ouvrir la semaine suivante.<br><button class="green" onclick="validerSemaine()">Valider définitivement les temps d’écran et passer à la semaine suivante</button></div>':''}<div class="card"><h1>Espace parent</h1><div class="grid">${cs.map(c=>`<div><h2>${c.prenom}</h2><div class="score">${c.temps} min</div><div>Base 120 min · bonus ${c.bonus>=0?'+':''}${c.bonus} pt · malus ${c.malus} pt · solde ${c.score} pt</div><div class="programme"><h3>Programme de la semaine en cours</h3>${programmeEnfant(d,c)||'Aucune obligation.'}</div></div>`).join('')}</div></div><div class="card"><h2>➕ Ajouter un bonus</h2><select id="enfantBonus">${cs.map(c=>`<option value="${c.id}">${c.prenom}</option>`).join('')}</select><input id="motifBonus" placeholder="Motif"><button class="green" onclick="ajouterBonusParent()">Ajouter +1</button></div><div class="card"><h2>Bonus déclarés</h2>${d.bonus.length?d.bonus.map(x=>`<div class="row"><div><b>${x.enfant}</b> · ${x.label}<div class="meta">${dateLongue(x.date)} · ${etatBonus(x.statut)}</div></div><button class="green" onclick="validerBonus('${x.id}')">Valider +1</button></div>`).join(''):'Aucun bonus.'}</div><div class="card"><h2>Malus de la semaine</h2>${d.penalites.length?d.penalites.map(x=>`<div class="row"><div><b>${x.enfant}</b> · ${x.label}<div class="meta">${dateLongue(x.date)} · −1 point</div></div><button class="green" onclick="annulerMalus('${x.id}')">Annuler le malus</button></div>`).join(''):'Aucun malus.'}</div><div class="card"><h2>Couvert · 7 prochains jours</h2>${d.repas.map(r=>`<div class="row"><span><b>${dateLongue(r.date)}</b> · ${r.repas}</span><select onchange="changerRepas('${r.date}','${r.repas}',this.value)">${cs.map(c=>`<option value="${c.id}" ${c.id===r.enfant_id?'selected':''}>${c.prenom}</option>`).join('')}</select></div>`).join('')}</div>`}
async function statutObligation(o,fait){try{await rpc('stoikos_parent_statut_obligation',{p_token:pt,p_enfant:o.enfant_id,p_date:o.date,p_cle:o.cle,p_label:o.label,p_fait:fait});parent()}catch(e){alert(e.message)}}async function annulerMalus(i){try{await rpc('stoikos_parent_suppr_penalite',{p_token:pt,p_id:i});parent()}catch(e){alert(e.message)}}async function validerBonus(i){try{await rpc('stoikos_parent_bonus',{p_token:pt,p_id:i,p_statut:'validee'});parent()}catch(e){alert(e.message)}}async function ajouterBonusParent(){try{await rpc('stoikos_parent_ajouter_bonus',{p_token:pt,p_enfant:enfantBonus.value,p_label:motifBonus.value||'Bonus parent'});parent()}catch(e){alert(e.message)}}async function changerRepas(d,r,e){try{await rpc('stoikos_parent_repas',{p_token:pt,p_date:d,p_repas:r,p_enfant:e});parent()}catch(x){alert(x.message)}}async function validerSemaine(){if(!confirm('Valider définitivement les temps d’écran et ouvrir la semaine suivante ?'))return;try{await rpc('stoikos_parent_valider_semaine',{p_token:pt});parent()}catch(e){alert(e.message)}}
(async()=>{try{pt?await parent():ct?await enfant():app.innerHTML='<div class="card">Lien requis</div>'}catch(e){app.innerHTML='<div class="card">Erreur : '+e.message+'</div>'}})();
</script></body></html>
