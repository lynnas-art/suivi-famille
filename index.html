<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stoïkos - Suivi famille</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#243047;--muted:#697386;--bg:#f5f7ff;--card:#fff;--violet:#7c3aed;--pink:#ec4899;--green:#10b981;--red:#ef4444;--line:#e7e9f2}*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:linear-gradient(135deg,#fff1f7,#f2f5ff 55%,#effff7);color:var(--ink)}header{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:#ffffffd9;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:2}.brand{font-size:1.35rem;font-weight:900}.badge{background:#ede9fe;color:#5b21b6;padding:8px 12px;border-radius:999px;font-weight:800}main{max-width:920px;margin:auto;padding:22px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 32px #4c1d9510;margin-bottom:16px}h1,h2,h3{margin:0 0 10px}p{color:var(--muted)}.score{font-size:3.2rem;font-weight:900;color:var(--violet)}.tasks{display:grid;gap:10px}.task{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:16px;padding:14px}.task.done{background:#ecfdf5;border-color:#a7f3d0}.label{font-weight:800}.meta{font-size:.85rem;color:var(--muted)}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer;background:var(--violet);color:white}button.secondary{background:#eef2ff;color:#4338ca}button:disabled{opacity:.45;cursor:not-allowed}.optional{display:grid;grid-template-columns:1fr auto;gap:10px}.notice{padding:12px;border-radius:14px;background:#fff7ed;color:#9a3412}.success{background:#ecfdf5;color:#065f46}.error{background:#fef2f2;color:#991b1b}.children{display:flex;flex-wrap:wrap;gap:10px}.child{background:#fff;border:2px solid var(--line);color:var(--ink)}.child.active{border-color:var(--violet);background:#f5f3ff}.small{font-size:.86rem}.hidden{display:none!important}.parentbar{display:flex;gap:8px;flex-wrap:wrap}.parent-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mealrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.mealrow select{padding:9px;border:1px solid var(--line);border-radius:10px;background:white}.danger{background:#fee2e2;color:#991b1b}@media(max-width:680px){.parent-grid{grid-template-columns:1fr}}@media(max-width:680px){.hero{grid-template-columns:1fr}.optional{grid-template-columns:1fr}.score{font-size:2.5rem}}
</style>
</head>
<body>
<header><div class="brand">🌈 Stoïkos</div><div class="parentbar"><button class="secondary" onclick="toggleParent()">👨‍👩‍👧 Parent</button><div id="cycle" class="badge">Chargement…</div></div></header>
<main id="app"><div class="card">Connexion à Supabase…</div></main>
<script>
const SUPABASE_URL='https://vxippwxflbmiximzlvmo.supabase.co';
const SUPABASE_KEY='sb_publishable_IwJG0MgCbUgjxh5w4EH6aQ_OGmhkuza';
const FAMILLE='Famille_Legrand';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const OPTIONALS=[['lave_vaisselle','Vider le lave-vaisselle'],['preparer_manger','Préparer à manger'],['debarrasser_table','Débarrasser toute la table'],['aspirateur_cuisine_sam','Passer l’aspirateur dans la cuisine et la salle à manger']];
let children=[], child=null, done=[], penalties=[], pendingAll=[], settings={minutes_par_point:15}, mealOverrides=[], parentOpen=false;
const parisParts=(d=new Date())=>{const x=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);return Object.fromEntries(x.map(p=>[p.type,p.value]))};
const localDate=(d=new Date())=>{const p=parisParts(d);return `${p.year}-${p.month}-${p.day}`};
const parseParis=(ymd,h=19)=>new Date(`${ymd}T${String(h).padStart(2,'0')}:00:00+01:00`); // novembre-mars; cycle calcule ci-dessous par decalage relatif
function cycleBounds(now=new Date()){
 const p=parisParts(now), noon=new Date(Date.UTC(+p.year,+p.month-1,+p.day,12));
 const weekday=(noon.getUTCDay()+6)%7; // lundi=0
 const daysSinceFriday=(weekday-4+7)%7;
 let fri=new Date(noon);fri.setUTCDate(fri.getUTCDate()-daysSinceFriday);
 const todayAfter19=daysSinceFriday===0 && (+p.hour>19 || (+p.hour===19 && +p.minute>=0));
 if(daysSinceFriday===0&&!todayAfter19)fri.setUTCDate(fri.getUTCDate()-7);
 const y=fri.getUTCFullYear(),m=String(fri.getUTCMonth()+1).padStart(2,'0'),d=String(fri.getUTCDate()).padStart(2,'0');
 // Conversion robuste de 19 h Europe/Paris vers UTC, y compris lors du changement d'heure.
 const target=Date.UTC(y,+m-1,+d,19,0,0);let guess=new Date(target);
 const gp=parisParts(guess);const shown=Date.UTC(+gp.year,+gp.month-1,+gp.day,+gp.hour,+gp.minute,0);
 const start=new Date(target-(shown-target)), end=new Date(start);end.setUTCDate(end.getUTCDate()+7);
 return {start,end,key:start.toISOString(),label:`du ${new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',timeZone:'Europe/Paris'}).format(start)} au ${new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',timeZone:'Europe/Paris'}).format(new Date(end-1))}`};
}
function mealKey(date,repas){return `${date}_${repas}`}
function defaultMealChild(date,repas){
 // Ancre demandee : jeudi 5 novembre 2026 au soir = Adele. Puis alternance a CHAQUE repas planifie.
 const anchor=new Date('2026-11-05T12:00:00'), d=new Date(date+'T12:00:00');
 let slots=0, step=d>=anchor?1:-1, cur=new Date(anchor);
 while(cur.toISOString().slice(0,10)!==date){
   if(step>0){cur.setDate(cur.getDate()+1);const dow=cur.getDay();slots+=1;if(dow===0||dow===6)slots+=1;}
   else {const dow=cur.getDay();slots-=1;if(dow===0||dow===6)slots-=1;cur.setDate(cur.getDate()-1);}
 }
 if(date==='2026-11-05'&&repas==='soir')slots=0;
 else {const dow=d.getDay(); if((dow===0||dow===6)&&repas==='soir') slots+=1;}
 const ordered=[...children].sort((a,b)=>a.ordre-b.ordre);if(!ordered.length)return null;
 const adeleIndex=Math.max(0,ordered.findIndex(c=>c.prenom==='Adèle'));
 return ordered[((adeleIndex+slots)%ordered.length+ordered.length)%ordered.length];
}
function mealChild(date,repas){const o=mealOverrides.find(x=>x.date_locale===date&&x.repas===repas);return o?children.find(c=>c.id===o.enfant_id):defaultMealChild(date,repas)}
function todayTasks(name){
 const p=parisParts(), dow=new Date(`${p.year}-${p.month}-${p.day}T12:00:00`).getDay(), list=[], date=localDate();
 const add=(key,label,time='avant 19 h')=>list.push({key:`${key}_${date}`,label,time});
 if(dow===2)add('chambre','Ranger sa chambre');
 if(dow===1)add('salon','Ranger le salon');
 add('musique','Faire de la musique');
 if(dow>=1&&dow<=5)add('devoirs','Faire ses devoirs');
 if(name==='Noah')add('douche','Prendre sa douche');
 if(name==='Adèle'&&[0,1,3,6].includes(dow))add('douche','Prendre sa douche');
 if((dow===0||dow===6)&&mealChild(date,'midi')?.prenom===name)add('couvert_midi','Mettre le couvert à 12 h','avant 12 h');
 if(mealChild(date,'soir')?.prenom===name)add('couvert_soir','Mettre le couvert ce soir');
 return list;
}
function beforeDeadline(task){const p=parisParts();const limit=task.time.includes('12 h')?12:19;return +p.hour<limit;}
function points(){const bonus=done.filter(r=>r.type==='optionnelle'&&r.statut==='validee').reduce((s,r)=>s+(r.points||1),0);const malus=penalties.reduce((s,r)=>s+r.points,0);return bonus+malus}
function screenMinutes(){return points()*settings.minutes_par_point}
async function load(){
 const token=new URLSearchParams(location.search).get('token');
 let q=db.from('enfants').select('*').eq('famille',FAMILLE).eq('actif',true).order('ordre');
 const {data,error}=await q;if(error)throw error;children=data||[];
 child=token?children.find(c=>c.access_token===token):children[0];
 if(!child)throw new Error('Lien enfant inconnu. Copiez le lien donné par la migration SQL.');
 const {data:cfg}=await db.from('parametres_stoikos').select('*').eq('famille',FAMILLE).maybeSingle();if(cfg)settings=cfg;
 const {data:ov}=await db.from('attributions_repas').select('*').eq('famille',FAMILLE);mealOverrides=ov||[];
 await refresh();
}
async function refresh(){const c=cycleBounds();document.querySelector('#cycle').textContent=c.label;const {data,error}=await db.from('realisations').select('*').eq('enfant_id',child.id).eq('cycle_debut',c.key).order('realisee_at',{ascending:false});if(error)throw error;done=data||[];const {data:pd}=await db.from('penalites_obligatoires').select('*').eq('enfant_id',child.id).eq('cycle_debut',c.key);penalties=pd||[];const {data:pa}=await db.from('realisations').select('*').eq('famille',FAMILLE).eq('cycle_debut',c.key).eq('type','optionnelle').eq('statut','en_attente').order('realisee_at',{ascending:false});pendingAll=pa||[];await applyMissedPenalties();const {data:pd2}=await db.from('penalites_obligatoires').select('*').eq('enfant_id',child.id).eq('cycle_debut',c.key);penalties=pd2||penalties;render();}
async function complete(task){const existing=done.find(r=>r.cle===task.key);if(existing){const {error}=await db.from('realisations').delete().eq('id',existing.id);if(error)return alert(error.message);return refresh();}if(!beforeDeadline(task))return alert('Trop tard : cette corvée ne peut plus rapporter de point.');const c=cycleBounds();const row={famille:FAMILLE,enfant_id:child.id,cycle_debut:c.key,date_locale:localDate(),cle:task.key,label:task.label,type:'obligatoire',points:0,statut:'validee'};const {error}=await db.from('realisations').insert(row);if(error&&error.code!=='23505')return alert(error.message);await refresh();}
async function addOptional(){const v=document.querySelector('#optional').value;if(!v)return;const [key,label]=OPTIONALS.find(x=>x[0]===v);const c=cycleBounds();const stamp=Date.now();const row={famille:FAMILLE,enfant_id:child.id,cycle_debut:c.key,date_locale:localDate(),cle:`option_${key}_${stamp}`,label,type:'optionnelle',points:1,statut:'en_attente'};const {error}=await db.from('realisations').insert(row);if(error)return alert(error.message);await refresh();}
async function deleteOptional(id){const r=done.find(x=>x.id===id&&x.type==='optionnelle');if(!r)return;const {error}=await db.from('realisations').delete().eq('id',id).eq('enfant_id',child.id);if(error)return alert(error.message);await refresh();}
async function validateOptional(id,ok){const {error}=await db.from('realisations').update({statut:ok?'validee':'refusee',validee_at:new Date().toISOString(),validee_par:'parent'}).eq('id',id).eq('type','optionnelle');if(error)return alert(error.message);await refresh();}
async function applyMissedPenalties(){const c=cycleBounds(),now=new Date(),start=new Date(c.start);const {data:allDone}=await db.from('realisations').select('enfant_id,date_locale,cle').eq('famille',FAMILLE).eq('cycle_debut',c.key).eq('type','obligatoire');const {data:allPen}=await db.from('penalites_obligatoires').select('enfant_id,date_locale,cle').eq('famille',FAMILLE).eq('cycle_debut',c.key);for(let d=new Date(start);d<now;d.setDate(d.getDate()+1)){const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);if(date===localDate())continue;for(const ch of children){for(const t of todayTasksForDate(ch.prenom,date)){const fait=(allDone||[]).some(r=>r.enfant_id===ch.id&&r.date_locale===date&&r.cle===t.key);const deja=(allPen||[]).some(r=>r.enfant_id===ch.id&&r.date_locale===date&&r.cle===t.key);if(!fait&&!deja){const {data:ins,error}=await db.from('penalites_obligatoires').insert({famille:FAMILLE,enfant_id:ch.id,cycle_debut:c.key,date_locale:date,cle:t.key,label:t.label,points:-1}).select('enfant_id,date_locale,cle').single();if(!error&&ins)(allPen||[]).push(ins);}}}}}
function todayTasksForDate(name,date){const save=localDate;const dow=new Date(date+'T12:00:00').getDay(),list=[];const add=(key,label)=>list.push({key:`${key}_${date}`,label});if(dow===2)add('chambre','Ranger sa chambre');if(dow===1)add('salon','Ranger le salon');add('musique','Faire de la musique');if(dow>=1&&dow<=5)add('devoirs','Faire ses devoirs');if(name==='Noah')add('douche','Prendre sa douche');if(name==='Adèle'&&[0,1,3,6].includes(dow))add('douche','Prendre sa douche');if((dow===0||dow===6)&&mealChild(date,'midi')?.prenom===name)add('couvert_midi','Mettre le couvert à 12 h');if(mealChild(date,'soir')?.prenom===name)add('couvert_soir','Mettre le couvert ce soir');return list;}

function toggleParent(){parentOpen=!parentOpen;render()}
function datePlus(base,n){const d=new Date(base+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function upcomingMeals(){const date=localDate(), out=[];for(let i=0;i<7;i++){const day=datePlus(date,i),dow=new Date(day+'T12:00:00').getDay();if(dow===0||dow===6)out.push({date:day,repas:'midi'});out.push({date:day,repas:'soir'});}return out}
async function setMeal(date,repas,enfantId){const row={famille:FAMILLE,date_locale:date,repas,enfant_id:enfantId,updated_at:new Date().toISOString()};const {error}=await db.from('attributions_repas').upsert(row,{onConflict:'famille,date_locale,repas'});if(error)return alert(error.message);const {data}=await db.from('attributions_repas').select('*').eq('famille',FAMILLE);mealOverrides=data||[];render()}
async function setMinutes(v){v=Number(v);if(!Number.isFinite(v)||v<0)return;const {error}=await db.from('parametres_stoikos').update({minutes_par_point:v,updated_at:new Date().toISOString()}).eq('famille',FAMILLE);if(error)return alert(error.message);settings.minutes_par_point=v;render()}
function parentPanel(){if(!parentOpen)return '';const meals=upcomingMeals();return `<div class="card"><h2>👨‍👩‍👧 Espace parent</h2><p>Réglages rapides. Un seul enfant est responsable du couvert à chaque repas.</p><div class="parent-grid"><div><h3>Temps d’écran</h3><div class="mealrow"><label>Minutes par point</label><input type="number" min="0" max="120" value="${settings.minutes_par_point}" onchange="setMinutes(this.value)" style="width:90px;padding:9px;border:1px solid var(--line);border-radius:10px"></div></div><div><h3>Enfants</h3><p class="small">${children.map(c=>c.prenom).join(' · ')}. L’ajout d’un enfant reste possible dans Supabase.</p></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Bonus à valider</h3><div class="tasks">${pendingAll.map(r=>{const who=children.find(c=>c.id===r.enfant_id)?.prenom||'Enfant';return `<div class="task"><div><div class="label">${r.label}</div><div class="meta">Déclarée par ${who}</div></div><div><button onclick="validateOptional('${r.id}',true)">Valider +1</button> <button class="danger" onclick="validateOptional('${r.id}',false)">Refuser</button></div></div>`}).join('')||'<p>Aucun bonus en attente.</p>'}</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Couvert · 7 prochains jours</h3><div class="tasks">${meals.map(m=>{const selected=mealChild(m.date,m.repas);const label=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'short'}).format(new Date(m.date+'T12:00:00'));return `<div class="task"><div><div class="label">🍽️ ${label} · ${m.repas}</div><div class="meta">Alternance automatique, modifiable ici</div></div><select onchange="setMeal('${m.date}','${m.repas}',this.value)">${children.map(c=>`<option value="${c.id}" ${c.id===selected?.id?'selected':''}>${c.prenom}</option>`).join('')}</select></div>`}).join('')}</div></div>`}
function render(){const tasks=todayTasks(child.prenom), map=new Set(done.map(x=>x.cle));const tokenMode=new URLSearchParams(location.search).has('token');document.querySelector('#app').innerHTML=`${parentPanel()}
 <div class="${tokenMode?'hidden':''} card"><h3>Choisir un enfant</h3><div class="children">${children.map(c=>`<button class="child ${c.id===child.id?'active':''}" onclick="child=children.find(x=>x.id==='${c.id}');refresh()">${c.prenom}</button>`).join('')}</div></div>
 <section class="hero"><div class="card"><h1>Bonjour ${child.prenom} 👋</h1><p>Les obligations évitent de perdre des points. Les corvées optionnelles rapportent 1 point après validation parent. Clôture vendredi à 19 h.</p><div class="score">${points()} point${points()>1?'s':''}</div></div><div class="card"><h2>Temps d’écran</h2><div class="score">${screenMinutes()} min</div><p class="small">Estimation avec ${settings.minutes_par_point} min par point, réglable dans Supabase.</p></div></section>
 <div class="card"><h2>À faire aujourd’hui</h2><div class="tasks">${tasks.length?tasks.map(t=>{const ok=map.has(t.key),late=!beforeDeadline(t);return `<div class="task ${ok?'done':''}"><div><div class="label">${ok?'✅':'○'} ${t.label}</div><div class="meta">${t.time}${late&&!ok?' · échéance dépassée':''}</div></div><button ${late&&!ok?'disabled':''} onclick='complete(${JSON.stringify(t)})'>${ok?'✓ Fait · annuler':late?'Trop tard':'J’ai fait'}</button></div>`}).join(''):'<p>Aucune corvée obligatoire aujourd’hui.</p>'}</div></div>
 <div class="card"><h2>J’ai fait une corvée en plus</h2><p>Déclare une corvée optionnelle. Elle rapportera 1 point après validation par un parent.</p><div class="optional"><select id="optional"><option value="">Choisir…</option>${OPTIONALS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><button onclick="addOptional()">Ajouter +1</button></div></div>
 <div class="card"><h2>Activité de la semaine</h2><div class="tasks">${done.length?done.map(r=>`<div class="task done"><div><div class="label">✅ ${r.label}</div><div class="meta">${r.type==='optionnelle'?`Bonus · ${r.statut==='validee'?'validé +1':r.statut==='refusee'?'refusé':'en attente de validation'}`:'Obligatoire · aucun point'} · ${new Date(r.realisee_at).toLocaleString('fr-FR',{timeZone:'Europe/Paris'})}</div></div>${r.type==='optionnelle'?`<button class="danger" onclick="deleteOptional('${r.id}')">Supprimer</button>`:'<strong>OK</strong>'}</div>`).join(''):'<p>Aucun point pour le moment.</p>'}</div></div>`}
load().catch(e=>document.querySelector('#app').innerHTML=`<div class="card error"><h2>Impossible de démarrer</h2><p>${e.message}</p><p>Exécutez d’abord <strong>migration_stoikos.sql</strong> dans Supabase.</p></div>`);
</script></body></html>
