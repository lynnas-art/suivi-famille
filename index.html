<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stoïkos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f6f5ff;color:#243047}header{padding:18px;background:white;font-weight:900}main{max-width:1050px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:18px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #ddd;padding:12px;border-radius:12px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.score{font-size:38px;font-weight:900;color:#7c3aed}button,select,input{padding:9px;border-radius:9px;border:1px solid #ddd}button{background:#7c3aed;color:white;font-weight:bold;cursor:pointer}.green{background:#059669}.red{background:#dc2626}.orange{background:#d97706}.meta{color:#697386;font-size:13px}.jour{margin-top:16px;border-top:2px solid #ede9fe;padding:16px;border-radius:14px}.jour-aujourdhui{background:#f0fdf4;border:2px solid #86efac}.jour-passe{background:#f8fafc;border:1px solid #cbd5e1;opacity:.88}.jour-titre{display:flex;justify-content:space-between;align-items:center}.etiquette-jour{font-size:12px;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534}.enfant-jour{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.enfant-jour h4{margin:0 0 8px}.programme{margin-top:12px}.ligne{padding:7px 0;border-top:1px solid #eee;font-size:14px}.alerte{background:#fff7ed;color:#9a3412;padding:14px;border-radius:12px;margin-bottom:12px}.bonus-attente{background:#fff7ed;border:2px solid #fb923c}.bonus-attente h2{color:#9a3412}.badge-attente{display:inline-block;background:#fed7aa;color:#9a3412;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.bonus-historique{background:#fafafa}.boutons{display:flex;gap:8px;flex-wrap:wrap}.bouton-neutre{background:#fff;color:#334155;border:1px solid #94a3b8}.statut-action{display:inline-block;padding:6px 10px;border-radius:8px;font-weight:800;margin-bottom:5px}.statut-fait{background:#dcfce7;color:#166534}.statut-non-fait{background:#fee2e2;color:#991b1b}.statut-a-faire{background:#e0f2fe;color:#075985}.statut-annule{background:#f1f5f9;color:#475569}.menu-modification{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}@media(max-width:650px){.row{flex-direction:column;align-items:flex-start}.row>div,.row>select{width:100%}}</style></head><body><header>🌈 Stoïkos</header><main id="app">Chargement…</main><script>
const db=supabase.createClient('https://vxippwxflbmiximzlvmo.supabase.co','sb_publishable_IwJG0MgCbUgjxh5w4EH6aQ_OGmhkuza'),q=new URLSearchParams(location.search),ct=q.get('token'),pt=q.get('parent');
async function rpc(n,a){const{data,error}=await db.rpc(n,a);if(error)throw error;return data}
const heure=x=>new Date(x).toLocaleTimeString('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit'});
const dateLongue=x=>{if(!x)return 'Date inconnue';const s=String(x),base=s.match(/^\d{4}-\d{2}-\d{2}/)?.[0];const d=base?new Date(base+'T12:00:00'):new Date(s);return Number.isNaN(d.getTime())?'Date inconnue':d.toLocaleDateString('fr-FR',{timeZone:'Europe/Paris',weekday:'long',day:'numeric',month:'long'})};
const duree=m=>{m=Number(m)||0;const hh=Math.floor(m/60),mm=m%60;if(hh===0)return `${mm} min`;if(mm===0)return `${hh} h`;return `${hh} h ${String(mm).padStart(2,'0')} min`};
const etat=s=>s==='fait'?'✅ Fait':s==='non_fait'?'❌ Non réalisé':s==='malus_annule'?'↩️ Non réalisé, malus annulé':'⏳ À faire';
const etatBonus=s=>s==='validee'?'Validé':s==='refusee'?'Refusé':'En attente';
async function enfant(){const d=await rpc('stoikos_enfant',{p_token:ct});app.innerHTML=`${d.attente_validation?'<div class="alerte">La semaine est terminée. Le nouveau programme apparaîtra après validation finale des parents.</div>':''}<div class="grid"><div class="card"><h1>Bonjour ${d.enfant}</h1><div class="score">Tu as ${d.score} pt${Math.abs(d.score)>1?'s':''} bonus</div><p>Base du week-end : 2 h. Chaque point ajoute ou retire 15 minutes.</p></div><div class="card"><h2>Temps d’écran du WE</h2><div class="score">${duree(d.minutes)}</div><p>Minimum 0 min · maximum 4 h</p></div></div><div class="card"><h2>À faire aujourd’hui</h2>${d.taches.length?d.taches.map(t=>`<div class="row"><div><b>${t.faite?'✅':'○'} ${t.label}</b><div class="meta">À faire avant ${heure(t.heure_action)} · déclarable jusqu’à ${heure(t.echeance_declaration)}</div></div><button onclick="cocher('${t.cle}')">${t.faite?'Annuler':'J’ai fait'}</button></div>`).join(''):'Aucune obligation disponible.'}</div><div class="card"><h2>Bonus de la semaine en cours</h2><select id="bonusChoisi"><option value="lave">🫧 Vider le lave-vaisselle</option><option value="repas">🍳 Préparer à manger</option><option value="table">🍽️ Débarrasser la table</option><option value="aspi">🧹 Passer l’aspirateur</option><option value="verre_compost">♻️ Sortir le verre + le compost</option></select> <button onclick="ajouterBonus()">Déclarer</button>${d.bonus.length?d.bonus.map(x=>`<div class="row"><div><b>${x.label}</b><div class="meta">${dateLongue(x.date)} · ${etatBonus(x.statut)}</div></div>${x.statut==='en_attente'?`<button class="red" onclick="supprimerBonus('${x.id}')">Supprimer</button>`:''}</div>`).join(''):'<p>Aucun bonus déclaré cette semaine.</p>'}</div>`}
async function cocher(c){try{await rpc('stoikos_cocher',{p_token:ct,p_cle:c});enfant()}catch(e){alert(e.message)}}async function ajouterBonus(){try{await rpc('stoikos_bonus',{p_token:ct,p_code:bonusChoisi.value});enfant()}catch(e){alert(e.message)}}async function supprimerBonus(i){try{await rpc('stoikos_suppr_bonus',{p_token:ct,p_id:i});enfant()}catch(e){alert(e.message)}}
function detailPoints(d,c){const bonus=(d.bonus||[]).filter(x=>x.enfant===c.prenom&&x.statut==='validee');const malus=(d.penalites||[]).filter(x=>x.enfant===c.prenom);return `<div class="card" style="margin-top:12px;background:#faf9ff"><h3>Calcul des points</h3><div><b>Bonus validés : +${bonus.length}</b></div>${bonus.map(x=>`<div class="ligne">➕ ${dateLongue(x.date)} · ${x.label} · +1</div>`).join('')||'<div class="ligne">Aucun bonus validé</div>'}<div style="margin-top:10px"><b>Malus actifs : −${malus.length}</b></div>${malus.map(x=>`<div class="ligne">➖ ${dateLongue(x.date)} · ${x.label} · −1 <button class="green" onclick="annulerMalus('${x.id}')">Annuler</button></div>`).join('')||'<div class="ligne">Aucun malus actif</div>'}<div class="ligne"><b>Total : ${bonus.length} − ${malus.length} = ${bonus.length-malus.length} point${Math.abs(bonus.length-malus.length)>1?'s':''}</b></div></div>`}
function dateParisAujourdhui(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function debutSemaineSamedi(){const auj=dateParisAujourdhui(),d=new Date(auj+'T12:00:00'),ecart=(d.getDay()-6+7)%7;d.setDate(d.getDate()-ecart);return d.toISOString().slice(0,10)}
function statutClasse(s){return s==='fait'?'statut-fait':s==='non_fait'?'statut-non-fait':s==='malus_annule'?'statut-annule':'statut-a-faire'}
function ligneObligation(o){return `<div class="row"><div><span class="statut-action ${statutClasse(o.statut)}">${etat(o.statut)}</span><div><b>${o.label}</b></div><div class="meta">Déclaration prévue jusqu’à ${heure(o.echeance)}</div><div class="menu-modification"><button class="bouton-neutre" onclick='statutObligation(${JSON.stringify(o)},true)'>Déclarer faite</button><button class="bouton-neutre" onclick='statutObligation(${JSON.stringify(o)},false)'>Déclarer non faite</button>${o.penalite_id?`<button class="bouton-neutre" onclick="annulerMalus('${o.penalite_id}')">Annuler le malus</button>`:''}</div></div></div>`}
function programmeParJour(d,cs){const auj=dateParisAujourdhui(),debut=debutSemaineSamedi(),lignes=(d.obligations||[]).filter(o=>o.date>=debut&&o.date<=auj),groupes={};lignes.forEach(o=>(groupes[o.date]??=[]).push(o));const dates=Object.keys(groupes),ordre=[...dates.filter(x=>x===auj),...dates.filter(x=>x<auj).sort().reverse()];return ordre.map(date=>`<section class="jour ${date===auj?'jour-aujourdhui':'jour-passe'}"><div class="jour-titre"><h3>${dateLongue(date)}</h3><span class="etiquette-jour">${date===auj?'Aujourd’hui':'Journée passée'}</span></div><div class="grid">${cs.map(c=>{const taches=groupes[date].filter(o=>o.enfant_id===c.id);return `<div class="enfant-jour"><h4>${c.prenom}</h4>${taches.map(ligneObligation).join('')||'<div class="meta">Aucune obligation</div>'}</div>`}).join('')}</div></section>`).join('')||'<p>Aucune obligation pour la semaine en cours.</p>'}
async function parent(){
 const d=await rpc('stoikos_parent',{p_token:pt}),cs=d.enfants;
 const bonusAttente=(d.bonus||[]).filter(x=>x.statut==='en_attente');
 const bonusTraites=(d.bonus||[]).filter(x=>x.statut!=='en_attente');
 app.innerHTML=`${d.validation_requise?'<div class="alerte"><b>Validation finale requise.</b> Vérifie les obligations, bonus et malus, puis valide les temps d’écran pour ouvrir la semaine suivante.<br><button class="green" onclick="validerSemaine()">Valider définitivement les temps d’écran et passer à la semaine suivante</button></div>':''}
 <div class="card"><h1>Espace parent</h1><div class="grid">${cs.map(c=>`<div><h2>${c.prenom}</h2><div class="score">${duree(c.temps)}</div><div>Base 120 min · bonus ${c.bonus>=0?'+':''}${c.bonus} pt · malus ${c.malus} pt · solde ${c.score} pt</div>${detailPoints(d,c)}</div>`).join('')}</div></div>
 <div class="card bonus-attente"><h2>🟠 Bonus à valider</h2>${bonusAttente.length?`<p><span class="badge-attente">${bonusAttente.length} validation${bonusAttente.length>1?'s':''} en attente</span></p>${bonusAttente.map(x=>`<div class="row"><div><b>${x.enfant}</b> · ${x.label}<div class="meta">${dateLongue(x.date)} · En attente</div></div><div class="boutons"><button class="green" onclick="validerBonus('${x.id}')">Valider +1</button><button class="red" onclick="refuserBonus('${x.id}')">Refuser</button></div></div>`).join('')}`:'<p><b>✅ Aucun bonus en attente de validation.</b></p>'}</div>
 <div class="card"><h2>Programme obligatoire de la semaine en cours</h2><p>Les corvées d’aujourd’hui apparaissent en premier. Les journées passées sont affichées ensuite, de la plus récente à la plus ancienne.</p>${programmeParJour(d,cs)}</div>
 <div class="card"><h2>➕ Ajouter un bonus</h2><select id="enfantBonus">${cs.map(c=>`<option value="${c.id}">${c.prenom}</option>`).join('')}</select><input id="motifBonus" placeholder="Motif"><button class="green" onclick="ajouterBonusParent()">Ajouter +1</button></div>
 <div class="card bonus-historique"><h2>Historique des bonus traités</h2>${bonusTraites.length?bonusTraites.map(x=>`<div class="row"><div><b>${x.enfant}</b> · ${x.label}<div class="meta">${dateLongue(x.date)} · ${etatBonus(x.statut)}</div></div>${x.statut==='refusee'?`<button class="green" onclick="validerBonus('${x.id}')">Valider finalement +1</button>`:`<button class="orange" onclick="remettreBonusEnAttente('${x.id}')">Remettre en attente</button>`}</div>`).join(''):'<p>Aucun bonus déjà traité.</p>'}</div>
 <div class="card"><h2>➖ Ajouter un malus ponctuel</h2><p>Choisis l’enfant et écris le motif du malus.</p><select id="enfantMalus">${cs.map(c=>`<option value="${c.id}">${c.prenom}</option>`).join('')}</select><input id="motifMalus" placeholder="Motif du malus"><button class="red" onclick="ajouterMalusParent()">Ajouter −1</button></div><div class="card"><h2>Malus de la semaine</h2>${d.penalites.length?d.penalites.map(x=>`<div class="row"><div><b>${x.enfant}</b> · ${x.label}<div class="meta">${dateLongue(x.date)} · −1 point</div></div><button class="green" onclick="annulerMalus('${x.id}')">Annuler le malus</button></div>`).join(''):'Aucun malus.'}</div>
 <div class="card"><h2>Couvert · 7 prochains jours</h2>${d.repas.map(r=>`<div class="row"><span><b>${dateLongue(r.date)}</b> · ${r.repas}</span><select onchange="changerRepas('${r.date}','${r.repas}',this.value)">${cs.map(c=>`<option value="${c.id}" ${c.id===r.enfant_id?'selected':''}>${c.prenom}</option>`).join('')}</select></div>`).join('')}</div>`
}
async function statutObligation(o,fait){try{await rpc('stoikos_parent_statut_obligation',{p_token:pt,p_enfant:o.enfant_id,p_date:o.date,p_cle:o.cle,p_label:o.label,p_fait:fait});parent()}catch(e){alert(e.message)}}async function annulerMalus(i){try{await rpc('stoikos_parent_suppr_penalite',{p_token:pt,p_id:i});parent()}catch(e){alert(e.message)}}async function validerBonus(i){try{await rpc('stoikos_parent_bonus',{p_token:pt,p_id:i,p_statut:'validee'});parent()}catch(e){alert(e.message)}}async function refuserBonus(i){try{await rpc('stoikos_parent_bonus',{p_token:pt,p_id:i,p_statut:'refusee'});parent()}catch(e){alert(e.message)}}async function remettreBonusEnAttente(i){try{await rpc('stoikos_parent_bonus',{p_token:pt,p_id:i,p_statut:'en_attente'});parent()}catch(e){alert(e.message)}}async function ajouterBonusParent(){try{await rpc('stoikos_parent_ajouter_bonus',{p_token:pt,p_enfant:enfantBonus.value,p_label:motifBonus.value||'Bonus parent'});parent()}catch(e){alert(e.message)}}async function ajouterMalusParent(){try{await rpc('stoikos_parent_ajouter_malus',{p_token:pt,p_enfant:enfantMalus.value,p_motif:motifMalus.value});parent()}catch(e){alert(e.message)}}async function changerRepas(d,r,e){try{await rpc('stoikos_parent_repas',{p_token:pt,p_date:d,p_repas:r,p_enfant:e});parent()}catch(x){alert(x.message)}}async function validerSemaine(){if(!confirm('Valider définitivement les temps d’écran et ouvrir la semaine suivante ?'))return;try{await rpc('stoikos_parent_valider_semaine',{p_token:pt});parent()}catch(e){alert(e.message)}}
(async()=>{try{pt?await parent():ct?await enfant():app.innerHTML='<div class="card">Lien requis</div>'}catch(e){app.innerHTML='<div class="card">Erreur : '+e.message+'</div>'}})();
</script><footer style="text-align:center;color:#64748b;padding:20px;font-size:12px">Stoïkos v10</footer></body></html>
