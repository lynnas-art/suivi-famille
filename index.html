<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stoïkos - Suivi famille</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#243047;--muted:#697386;--bg:#f5f7ff;--card:#fff;--violet:#7c3aed;--pink:#ec4899;--green:#10b981;--red:#ef4444;--line:#e7e9f2}*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:linear-gradient(135deg,#fff1f7,#f2f5ff 55%,#effff7);color:var(--ink)}header{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:#ffffffd9;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:2}.brand{font-size:1.35rem;font-weight:900}.badge{background:#ede9fe;color:#5b21b6;padding:8px 12px;border-radius:999px;font-weight:800}main{max-width:920px;margin:auto;padding:22px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 32px #4c1d9510;margin-bottom:16px}h1,h2,h3{margin:0 0 10px}p{color:var(--muted)}.score{font-size:3.2rem;font-weight:900;color:var(--violet)}.tasks{display:grid;gap:10px}.task{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:16px;padding:14px}.task.done{background:#ecfdf5;border-color:#a7f3d0}.label{font-weight:800}.meta{font-size:.85rem;color:var(--muted)}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer;background:var(--violet);color:white}button.secondary{background:#eef2ff;color:#4338ca}button:disabled{opacity:.45;cursor:not-allowed}.optional{display:grid;grid-template-columns:1fr auto;gap:10px}.notice{padding:12px;border-radius:14px;background:#fff7ed;color:#9a3412}.success{background:#ecfdf5;color:#065f46}.error{background:#fef2f2;color:#991b1b}.children{display:flex;flex-wrap:wrap;gap:10px}.child{background:#fff;border:2px solid var(--line);color:var(--ink)}.child.active{border-color:var(--violet);background:#f5f3ff}.small{font-size:.86rem}.hidden{display:none!important}@media(max-width:680px){.hero{grid-template-columns:1fr}.optional{grid-template-columns:1fr}.score{font-size:2.5rem}}
</style>
</head>
<body>
<header><div class="brand">🌈 Stoïkos</div><div id="cycle" class="badge">Chargement…</div></header>
<main id="app"><div class="card">Connexion à Supabase…</div></main>
<script>
const SUPABASE_URL='https://vxippwxflbmiximzlvmo.supabase.co';
const SUPABASE_KEY='sb_publishable_IwJG0MgCbUgjxh5w4EH6aQ_OGmhkuza';
const FAMILLE='Famille_Legrand';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const OPTIONALS=[['lave_vaisselle','Vider le lave-vaisselle'],['preparer_manger','Préparer à manger'],['debarrasser_table','Débarrasser toute la table'],['aspirateur_cuisine_sam','Passer l’aspirateur dans la cuisine et la salle à manger']];
let children=[], child=null, done=[], settings={minutes_par_point:15};
const parisParts=(d=new Date())=>{const x=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);return Object.fromEntries(x.map(p=>[p.type,p.value]))};
const localDate=(d=new Date())=>{const p=parisParts(d);return `${p.year}-${p.month}-${p.day}`};
const parseParis=(ymd,h=19)=>new Date(`${ymd}T${String(h).padStart(2,'0')}:00:00+01:00`); // novembre-mars; cycle calcule ci-dessous par decalage relatif
function cycleBounds(now=new Date()){
 const p=parisParts(now), noon=new Date(Date.UTC(+p.year,+p.month-1,+p.day,12));
 const weekday=(noon.getUTCDay()+6)%7; // lundi=0
 const daysSinceFriday=(weekday-4+7)%7;
 let fri=new Date(noon);fri.setUTCDate(fri.getUTCDate()-daysSinceFriday);
 const todayAfter19=daysSinceFriday===0 && (+p.hour>19 || (+p.hour===19 && +p.minute>=0));
 if(daysSinceFriday===0&&!todayAfter19)fri.setUTCDate(fri.getUTCDate()-7);
 const y=fri.getUTCFullYear(),m=String(fri.getUTCMonth()+1).padStart(2,'0'),d=String(fri.getUTCDate()).padStart(2,'0');
 // Conversion robuste de 19 h Europe/Paris vers UTC, y compris lors du changement d'heure.
 const target=Date.UTC(y,+m-1,+d,19,0,0);let guess=new Date(target);
 const gp=parisParts(guess);const shown=Date.UTC(+gp.year,+gp.month-1,+gp.day,+gp.hour,+gp.minute,0);
 const start=new Date(target-(shown-target)), end=new Date(start);end.setUTCDate(end.getUTCDate()+7);
 return {start,end,key:start.toISOString(),label:`du ${new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',timeZone:'Europe/Paris'}).format(start)} au ${new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',timeZone:'Europe/Paris'}).format(new Date(end-1))}`};
}
function todayTasks(name){
 const p=parisParts(), dow=new Date(`${p.year}-${p.month}-${p.day}T12:00:00`).getDay(), list=[];
 const add=(key,label,time='avant 19 h')=>list.push({key:`${key}_${localDate()}`,label,time});
 if(dow===2)add('chambre','Ranger sa chambre');
 if(dow===1)add('salon','Ranger le salon');
 add('musique','Faire de la musique');
 if(dow>=1&&dow<=5)add('devoirs','Faire ses devoirs');
 if(name==='Noah')add('douche','Prendre sa douche');
 if(name==='Adèle'&&[0,1,3,6].includes(dow))add('douche','Prendre sa douche');
 // Couvert : alternance deterministe selon le nombre de jours depuis 01/01/2026. Tous les soirs + sam/dim midi.
 const epoch=Math.floor(new Date(localDate()+'T12:00:00')-new Date('2026-01-01T12:00:00'))/86400000;
 const assigned=children[Math.abs(epoch)%children.length]?.prenom;
 if(name===assigned){add('couvert_soir','Mettre le couvert ce soir');if(dow===0||dow===6)add('couvert_midi','Mettre le couvert à 12 h','avant 12 h');}
 return list;
}
function beforeDeadline(task){const p=parisParts();const limit=task.time.includes('12 h')?12:19;return +p.hour<limit;}
function points(){return done.reduce((s,r)=>s+(r.points||1),0)}
function screenMinutes(){return points()*settings.minutes_par_point}
async function load(){
 const token=new URLSearchParams(location.search).get('token');
 let q=db.from('enfants').select('*').eq('famille',FAMILLE).eq('actif',true).order('ordre');
 const {data,error}=await q;if(error)throw error;children=data||[];
 child=token?children.find(c=>c.access_token===token):children[0];
 if(!child)throw new Error('Lien enfant inconnu. Copiez le lien donné par la migration SQL.');
 const {data:cfg}=await db.from('parametres_stoikos').select('*').eq('famille',FAMILLE).maybeSingle();if(cfg)settings=cfg;
 await refresh();
}
async function refresh(){const c=cycleBounds();document.querySelector('#cycle').textContent=c.label;const {data,error}=await db.from('realisations').select('*').eq('enfant_id',child.id).eq('cycle_debut',c.key).order('realisee_at',{ascending:false});if(error)throw error;done=data||[];render();}
async function complete(task){if(!beforeDeadline(task))return alert('Trop tard : cette corvée ne peut plus rapporter de point.');const c=cycleBounds();const row={famille:FAMILLE,enfant_id:child.id,cycle_debut:c.key,date_locale:localDate(),cle:task.key,label:task.label,type:'obligatoire',points:1};const {error}=await db.from('realisations').insert(row);if(error&&error.code!=='23505')return alert(error.message);await refresh();}
async function addOptional(){const v=document.querySelector('#optional').value;if(!v)return;const [key,label]=OPTIONALS.find(x=>x[0]===v);const c=cycleBounds();const stamp=Date.now();const row={famille:FAMILLE,enfant_id:child.id,cycle_debut:c.key,date_locale:localDate(),cle:`option_${key}_${stamp}`,label,type:'optionnelle',points:1};const {error}=await db.from('realisations').insert(row);if(error)return alert(error.message);await refresh();}
function render(){const tasks=todayTasks(child.prenom), map=new Set(done.map(x=>x.cle));const tokenMode=new URLSearchParams(location.search).has('token');document.querySelector('#app').innerHTML=`
 <div class="${tokenMode?'hidden':''} card"><h3>Choisir un enfant</h3><div class="children">${children.map(c=>`<button class="child ${c.id===child.id?'active':''}" onclick="child=children.find(x=>x.id==='${c.id}');refresh()">${c.prenom}</button>`).join('')}</div></div>
 <section class="hero"><div class="card"><h1>Bonjour ${child.prenom} 👋</h1><p>Chaque corvée réalisée vaut 1 point. La semaine se clôture vendredi à 19 h.</p><div class="score">${points()} point${points()>1?'s':''}</div></div><div class="card"><h2>Temps d’écran</h2><div class="score">${screenMinutes()} min</div><p class="small">Estimation avec ${settings.minutes_par_point} min par point, réglable dans Supabase.</p></div></section>
 <div class="card"><h2>À faire aujourd’hui</h2><div class="tasks">${tasks.length?tasks.map(t=>{const ok=map.has(t.key),late=!beforeDeadline(t);return `<div class="task ${ok?'done':''}"><div><div class="label">${ok?'✅':'○'} ${t.label}</div><div class="meta">${t.time}${late&&!ok?' · échéance dépassée':''}</div></div><button ${ok||late?'disabled':''} onclick='complete(${JSON.stringify(t)})'>${ok?'Fait':late?'Trop tard':'J’ai fait'}</button></div>`}).join(''):'<p>Aucune corvée obligatoire aujourd’hui.</p>'}</div></div>
 <div class="card"><h2>J’ai fait une corvée en plus</h2><p>Déclare une corvée optionnelle pour gagner 1 point.</p><div class="optional"><select id="optional"><option value="">Choisir…</option>${OPTIONALS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><button onclick="addOptional()">Ajouter +1</button></div></div>
 <div class="card"><h2>Activité de la semaine</h2><div class="tasks">${done.length?done.map(r=>`<div class="task done"><div><div class="label">✅ ${r.label}</div><div class="meta">${r.type==='optionnelle'?'Bonus':'Obligatoire'} · ${new Date(r.realisee_at).toLocaleString('fr-FR',{timeZone:'Europe/Paris'})}</div></div><strong>+${r.points}</strong></div>`).join(''):'<p>Aucun point pour le moment.</p>'}</div></div>`}
load().catch(e=>document.querySelector('#app').innerHTML=`<div class="card error"><h2>Impossible de démarrer</h2><p>${e.message}</p><p>Exécutez d’abord <strong>migration_stoikos.sql</strong> dans Supabase.</p></div>`);
</script></body></html>
